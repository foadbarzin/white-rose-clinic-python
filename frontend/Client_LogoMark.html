<!--
  Client_LogoMark.html - brand mark only (no wordmark).
  Gold line artwork: rose bud + face profile + stethoscope on deep green.
  512x512 viewBox keeps it crisp at any size (sidebar, splash, favicons).
  Brand assets must never be replaced with generic logos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="rsmTitle rsmDesc" focusable="false">
  <title id="rsmTitle">Rose Sefid Beauty Clinic</title>
  <desc id="rsmDesc">Gold line mark combining a rose bud, a face profile and a stethoscope</desc>
  <defs>
    <linearGradient id="rsmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E08A"/>
      <stop offset="35%" stop-color="#E2C45A"/>
      <stop offset="72%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9E7C19"/>
    </linearGradient>
    <linearGradient id="rsmGold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="48%" stop-color="#E2C45A"/>
      <stop offset="100%" stop-color="#B08A1C"/>
    </linearGradient>
    <filter id="rsmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#C9A227" flood-opacity="0.40"/>
    </filter>
  </defs>

  <g filter="url(#rsmGlow)" fill="none" stroke="url(#rsmGold)" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- rose bud: centre petal -->
    <path d="M256 86 C232 132 221 180 223 214 C225 252 239 282 256 302 C273 282 287 252 289 214 C291 180 280 132 256 86 Z"/>
    <!-- rose bud: left petal -->
    <path d="M238 300 C208 292 182 262 178 226 C175 196 188 168 208 148"/>
    <!-- rose bud: right petal -->
    <path d="M274 300 C304 292 330 262 334 226 C337 196 324 168 304 148"/>
    <!-- stem -->
    <path d="M256 302 L256 336"/>

    <!-- stethoscope: left and right tubes down to the junction -->
    <path d="M176 172 C158 218 165 264 192 292 C212 313 234 326 256 330"/>
    <path d="M336 172 C354 218 347 264 320 292 C300 313 278 326 256 330"/>

    <!-- stethoscope: tube from junction to chest piece -->
    <path d="M256 336 C250 380 266 414 306 431 C338 444 372 437 392 414"/>

    <!-- face profile (facing right) -->
    <path d="M380 88 C406 116 416 152 407 184 C402 202 411 212 422 224 C433 238 417 249 402 253 C416 260 418 275 405 283 C398 288 386 288 378 294 C372 299 370 310 366 320"/>
  </g>

  <!-- stethoscope earpieces -->
  <rect x="163" y="142" width="26" height="26" rx="7" fill="url(#rsmGold2)" stroke="url(#rsmGold)" stroke-width="4"/>
  <rect x="323" y="142" width="26" height="26" rx="7" fill="url(#rsmGold2)" stroke="url(#rsmGold)" stroke-width="4"/>

  <!-- chest piece -->
  <circle cx="410" cy="402" r="29" fill="none" stroke="url(#rsmGold)" stroke-width="8"/>
  <circle cx="410" cy="402" r="12" fill="url(#rsmGold2)"/>

  <!-- light sparkles -->
  <path d="M146 108 l3.4 10.2 10.2 3.4 -10.2 3.4 -3.4 10.2 -3.4 -10.2 -10.2 -3.4 10.2 -3.4 Z" fill="#F6E08A" opacity="0.9"/>
  <path d="M386 62 l2.6 7.8 7.8 2.6 -7.8 2.6 -2.6 7.8 -2.6 -7.8 -7.8 -2.6 7.8 -2.6 Z" fill="#FFF0B8" opacity="0.7"/>
</svg>
