<style>
/* ============================================================================
   White Rose Clinic V2 - Design System v2 (RTL / Persian)
   Palette: ivory, deep black, metallic gold, petroleum green
   Section map: 1 tokens  2 base  3 shell  4 cards/panels  5 controls
                6 tables  7 feedback  8 auth  9 overlays  10 responsive
   ========================================================================== */

/* ------------------------------------------------------------- 1) TOKENS -- */
:root{
  /* brand */
  --color-gold:#C9A227;
  --color-gold-light:#E2C45A;
  --color-gold-dark:#9E7C19;
  --color-black:#0B0B0B;
  --color-black-soft:#141414;
  --color-teal:#0B3D3A;
  --color-teal-dark:#072928;
  --color-teal-light:#14524E;
  --color-ivory:#F7F3E8;
  --color-white:#FFFFFF;

  /* surfaces (brand-tinted: deep petroleum green) */
  --color-bg:#08110F;
  --color-surface:#0E1C19;
  --color-surface-2:#142925;
  --color-surface-3:#1B3531;
  --color-border:rgba(201,162,39,.20);
  --color-border-strong:rgba(201,162,39,.45);
  --color-line:rgba(198,226,220,.08);

  /* text */
  --color-text:#F4F1E6;
  --color-text-muted:#A9A395;
  --color-text-dim:#7C7768;

  /* states */
  --color-danger:#C0392B;
  --color-success:#1E8449;
  --color-warning:#D68910;
  --color-info:#2471A3;

  /* geometry & elevation */
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:8px;
  --radius-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.28);
  --shadow:0 10px 30px rgba(0,0,0,.40);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(201,162,39,.22);
  --ease:cubic-bezier(.22,.61,.36,1);

  /* typography */
  --font:"Vazirmatn","Vazir","IRANSansX","IRANSans","Segoe UI",Tahoma,Arial,sans-serif;
  --fs-xs:.78rem; --fs-sm:.86rem; --fs-md:.95rem; --fs-lg:1.06rem; --fs-xl:1.32rem;

  --sidebar-w:262px;
}

/* --------------------------------------------------------------- 2) BASE -- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  font-size:var(--fs-md);
  line-height:1.75;
  color:var(--color-text);
  background-color:var(--color-bg);
  background-image:
    radial-gradient(1200px 560px at 100% -10%, rgba(11,61,58,.70), transparent 62%),
    radial-gradient(900px 500px at 0% 0%, rgba(201,162,39,.09), transparent 58%),
    radial-gradient(900px 520px at 10% 105%, rgba(11,61,58,.45), transparent 60%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  min-height:100vh;
  letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{margin:0 0 .6em;line-height:1.45;font-weight:700}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--color-gold-light);text-decoration:none;transition:color .15s var(--ease)}
a:hover{color:var(--color-gold);text-decoration:underline}
img,svg{max-width:100%}
::selection{background:rgba(201,162,39,.35);color:#fff}
:focus-visible{outline:2px solid var(--color-gold-light);outline-offset:2px;border-radius:6px}
button,input,select,textarea,summary{font-family:inherit;font-size:inherit}
[hidden],.hidden{display:none!important}
b,strong{font-weight:800}
small,.small{font-size:var(--fs-sm)}

/* branded thin scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(201,162,39,.32) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:rgba(201,162,39,.28);border-radius:99px;
  border:2px solid transparent;background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:rgba(201,162,39,.5);background-clip:content-box}

body.modal-open{overflow:hidden}


/* -------------------------------------------------------------- 3) SHELL -- */
.app-shell{display:flex;min-height:100vh;align-items:stretch}

.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0B3D3A 0%,#07211F 52%,#05100E 100%);
  border-inline-start:1px solid var(--color-border);
  position:sticky;top:0;height:100vh;z-index:20;
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:18px 16px;border-bottom:1px solid var(--color-line);
}
.brand .logo{
  flex:0 0 auto;display:grid;place-items:center;
  width:52px;height:52px;padding:5px;border-radius:14px;
  background:radial-gradient(circle at 30% 15%,#0E4A45,#04100F 72%);
  border:1px solid rgba(201,162,39,.30);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
}
.brand .logo svg{width:100%;height:100%;border-radius:0;box-shadow:none}
.brand .title{
  font-size:.95rem;font-weight:800;letter-spacing:1.2px;
  color:var(--color-gold-light);line-height:1.25;
}
.brand .subtitle{font-size:.68rem;letter-spacing:1.6px;color:var(--color-text-dim)}

.nav{
  flex:1 1 auto;display:flex;flex-direction:column;gap:4px;
  padding:12px 10px 16px;overflow-y:auto;overflow-x:hidden;
}
/* One shared row style for every navigation entry (top level + submenu).
   Keeps all top items on the same visual baseline: same height, icon box,
   font size and padding. */
.nav-item{
  position:relative;display:flex;align-items:center;gap:10px;
  width:100%;min-height:42px;padding:9px 12px;text-align:start;
  background:transparent;border:1px solid transparent;
  border-radius:var(--radius-sm);color:var(--color-ivory);
  font-family:inherit;font-size:var(--fs-md);font-weight:600;line-height:1.5;
  cursor:pointer;
  transition:background .18s var(--ease),border-color .18s var(--ease),
             color .18s var(--ease);
}
.nav-ico{
  flex:0 0 18px;width:18px;height:18px;display:grid;place-items:center;
  color:inherit;opacity:.72;
  transition:opacity .18s var(--ease);
}
.nav-ico svg{display:block;width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-label{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{
  background:rgba(201,162,39,.09);
  border-color:rgba(201,162,39,.22);
  color:var(--color-gold-light);
}
.nav-item:hover .nav-ico{opacity:1}
.nav-item.active,
.nav-item.is-open{
  background:linear-gradient(90deg,rgba(201,162,39,.20),rgba(201,162,39,.05));
  border-color:var(--color-border-strong);
  color:var(--color-gold-light);
  box-shadow:inset -3px 0 0 var(--color-gold);
}
.nav-item.active .nav-ico,
.nav-item.is-open .nav-ico{opacity:1}
.nav-item:focus-visible{outline:2px solid var(--color-gold);outline-offset:2px}

/* collapsible submenu (مدیریت عملیات / تعاریف پایه) */
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-parent .chev{
  font-size:.62rem;color:var(--color-text-dim);
  transition:transform .2s var(--ease),color .2s var(--ease);
}
.nav-group.open .nav-parent .chev{transform:rotate(180deg);color:var(--color-gold)}
.nav-sub{
  display:none;flex-direction:column;gap:2px;
  margin:2px 0 4px;padding-inline-start:14px;
  border-inline-start:1px solid rgba(201,162,39,.22);
}
.nav-group.open .nav-sub{display:flex}
.nav-child{min-height:36px;padding:7px 10px;font-size:var(--fs-sm);font-weight:600;color:var(--color-text-muted)}
.nav-dot{
  flex:0 0 6px;width:6px;height:6px;border-radius:50%;
  background:currentColor;opacity:.4;transition:opacity .18s var(--ease),background .18s var(--ease);
}
.nav-child:hover{background:rgba(201,162,39,.08);color:var(--color-gold-light)}
.nav-child.active{background:rgba(201,162,39,.14);border-color:var(--color-border-strong);color:var(--color-gold-light)}
.nav-child.active .nav-dot{background:var(--color-gold);opacity:1}

@media (max-width:900px){
  .nav{flex-wrap:wrap}
  .nav-group{flex:1 0 100%}
  .nav-group.open .nav-sub{
    flex-direction:row;flex-wrap:wrap;gap:6px;
    border-inline-start:none;padding-inline-start:0;margin:0 0 6px;
  }
  .nav-child{width:auto;white-space:nowrap;min-height:32px}
}

.sidebar-footer{
  padding:12px;border-top:1px solid var(--color-line);
  font-size:var(--fs-sm);color:var(--color-text-muted);
  background:rgba(0,0,0,.18);
}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.user-chip .avatar{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(160deg,var(--color-gold-light),var(--color-gold-dark));
  color:#1a1406;font-weight:800;font-size:.95rem;
  box-shadow:0 4px 12px rgba(201,162,39,.25);
}
.user-chip .user-meta{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.user-chip .user-name{
  color:var(--color-ivory);font-weight:700;font-size:var(--fs-sm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-chip .user-role{color:var(--color-text-dim);font-size:var(--fs-xs)}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

.topbar{
  height:64px;display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-3);padding:0 clamp(14px,2vw,24px);
  border-bottom:1px solid var(--color-border);
  background:rgba(7,17,15,.78);
  box-shadow:inset 0 -1px 0 rgba(201,162,39,.16);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:15;
}
.page-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.topbar-logo{
  flex:0 0 auto;display:grid;place-items:center;
  width:38px;height:38px;padding:4px;border-radius:11px;
  background:radial-gradient(circle at 30% 15%,#12504A,#061A17 72%);
  border:1px solid rgba(201,162,39,.30);
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.topbar-logo svg{width:100%;height:100%}
.topbar .page-title{
  font-size:var(--fs-xl);font-weight:800;color:var(--color-gold-light);
  letter-spacing:.2px;display:flex;align-items:center;gap:10px;
}
.topbar .page-title::before{
  content:"";width:4px;height:20px;border-radius:99px;
  background:linear-gradient(180deg,var(--color-gold-light),var(--color-gold-dark));
}
.topbar .user{
  display:flex;align-items:center;gap:10px;
  color:var(--color-text-muted);font-size:var(--fs-sm);
}
.topbar .user .avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--color-gold-light),var(--color-gold-dark));
  color:#1a1406;font-weight:800;font-size:.8rem;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}

.content{
  flex:1 1 auto;width:100%;
  padding:clamp(14px,2vw,26px);
  max-width:1500px;margin-inline:auto;
}


/* ---------------------------------------------------- 4) CARDS & PANELS -- */
.grid{display:grid;gap:var(--sp-3)}
.grid.cards{grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:var(--sp-3)}

.card{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  gap:var(--sp-2);min-height:108px;padding:var(--sp-4);
  background:linear-gradient(160deg,var(--color-surface-2),var(--color-surface));
  border:1px solid var(--color-border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden;
  transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.card::before{
  content:"";position:absolute;inset-block-start:0;inset-inline:0;height:3px;
  background:linear-gradient(90deg,var(--color-gold-dark),var(--color-gold-light),var(--color-gold-dark));
  opacity:.75;
}
.card:hover{
  transform:translateY(-3px);
  border-color:var(--color-border-strong);
  box-shadow:var(--shadow);
}
.card h3{
  margin:0;font-size:var(--fs-sm);font-weight:600;
  color:var(--color-text-muted);letter-spacing:.2px;
}
.card .value{
  font-size:clamp(1.05rem,1.5vw,1.5rem);
  font-weight:800;color:var(--color-gold-light);line-height:1.5;
  font-variant-numeric:tabular-nums;word-spacing:2px;
}
.card .hint{margin:0;font-size:var(--fs-xs);color:var(--color-text-dim)}

.panel{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:clamp(14px,1.6vw,20px);
  margin-bottom:var(--sp-4);
  box-shadow:var(--shadow-sm);
}
.panel > h2,.panel > h3{
  color:var(--color-gold-light);font-size:var(--fs-lg);
  display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-3);
}
.panel > h2::after,.panel > h3::after{
  content:"";flex:1 1 auto;height:1px;
  background:linear-gradient(90deg,var(--color-border-strong),transparent);
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap;
}
.panel-header h2{margin:0;font-size:var(--fs-lg);color:var(--color-gold-light)}
.toolbar{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}


/* ------------------------------------------------------------ 5) CONTROLS -- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:8px 16px;
  background:var(--color-teal);color:var(--color-ivory);
  border:1px solid rgba(201,162,39,.30);border-radius:var(--radius-sm);
  font-weight:700;cursor:pointer;white-space:nowrap;
  transition:background .18s var(--ease),transform .12s var(--ease),
             box-shadow .18s var(--ease),border-color .18s var(--ease),opacity .18s;
}
.btn:hover{background:var(--color-teal-light);border-color:rgba(201,162,39,.5)}
.btn:active{transform:translateY(1px)}
.btn.gold{
  background:linear-gradient(180deg,var(--color-gold-light),var(--color-gold-dark));
  color:#1a1406;border:none;box-shadow:0 6px 18px rgba(201,162,39,.22);
}
.btn.gold:hover{
  background:linear-gradient(180deg,#F0D97A,var(--color-gold));
  box-shadow:0 8px 22px rgba(201,162,39,.32);
}
.btn.secondary{background:#1C2222;border-color:rgba(255,255,255,.10);color:var(--color-ivory)}
.btn.secondary:hover{background:#252D2D}
.btn.danger{background:#5E1B1B;border-color:#8E2B2B;color:#F8D7D3}
.btn.danger:hover{background:#742121}
.btn.sm{min-height:32px;padding:5px 11px;font-size:var(--fs-sm);border-radius:var(--radius-xs)}
.btn.block{width:100%}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.loading{opacity:.75;pointer-events:none}

input,select,textarea{
  width:100%;min-height:40px;padding:9px 12px;
  background:#0F1414;color:var(--color-text);
  border:1px solid #2A3232;border-radius:var(--radius-sm);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease);
}
textarea{min-height:90px;resize:vertical;line-height:1.7}
input::placeholder,textarea::placeholder{color:var(--color-text-dim)}
input:hover,select:hover,textarea:hover{border-color:#374141}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--color-gold);background:#101616;box-shadow:var(--ring);
}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
label{
  display:block;margin-bottom:6px;font-size:var(--fs-sm);
  color:var(--color-text-muted);font-weight:600;
}
.form-group{margin-bottom:var(--sp-3)}
.form-group:focus-within > label{color:var(--color-gold-light)}
.form-grid{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

/* spinner / loading state */
.loading{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:34px 16px;color:var(--color-text-muted);font-size:var(--fs-sm);
}
.spinner{
  width:16px;height:16px;border-radius:50%;flex:0 0 auto;
  border:2px solid rgba(201,162,39,.22);border-top-color:var(--color-gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}


/* ------------------------------------------- 5b) REPORT RANGE & CHART -- */
.range-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.input-sm{width:auto;min-height:34px;padding:6px 10px;font-size:var(--fs-sm);border-radius:var(--radius-xs)}
input[type="date"].input-sm{min-width:134px}

.segmented{
  display:inline-flex;gap:2px;padding:3px;
  background:rgba(0,0,0,.25);border:1px solid var(--color-border);
  border-radius:var(--radius-pill);
}
.seg-btn{
  border:none;background:transparent;color:var(--color-text-muted);
  padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;
  font-size:var(--fs-sm);font-weight:700;white-space:nowrap;
  transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);
}
.seg-btn:hover{color:var(--color-gold-light);background:rgba(201,162,39,.10)}
.seg-btn.active{
  background:linear-gradient(180deg,var(--color-gold-light),var(--color-gold-dark));
  color:#1a1406;box-shadow:0 3px 10px rgba(201,162,39,.25);
}

.chart-card{
  margin-top:var(--sp-4);padding:var(--sp-4);
  background:rgba(0,0,0,.18);border:1px solid var(--color-line);
  border-radius:var(--radius);
}
.chart-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:var(--sp-2);
}
.chart-title{font-weight:800;color:var(--color-gold-light);font-size:var(--fs-md)}
.chart-legend{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:var(--fs-xs);color:var(--color-text-muted);
}
.chart-legend .dot{
  display:inline-block;width:9px;height:9px;border-radius:3px;
  margin-inline-end:6px;vertical-align:middle;
}
.chart-legend .dot.income{background:linear-gradient(180deg,var(--color-gold-light),var(--color-gold))}
.chart-legend .dot.expense{background:#35A79E}
.chart-legend .dot.net{background:var(--color-ivory);border-radius:50%}

.chart{display:block;width:100%;height:auto;margin-top:6px}
.chart-grid{stroke:rgba(255,255,255,.07);stroke-width:1;stroke-dasharray:3 5}
.chart-base{stroke:rgba(201,162,39,.35);stroke-width:1.5}
.chart-axis{fill:var(--color-text-dim);font-family:var(--font);font-size:11px}
.chart-axis.x{font-size:10.5px}
.chart-bar.income{fill:url(#chartGold)}
.chart-bar.expense{fill:#35A79E;opacity:.85}
.chart-net{fill:none;stroke:var(--color-ivory);stroke-width:2;stroke-dasharray:5 4;opacity:.8}
.chart-empty{
  margin-top:8px;padding:38px 14px;text-align:center;
  color:var(--color-text-dim);font-size:var(--fs-sm);
  border:1px dashed var(--color-border);border-radius:var(--radius-sm);
}

/* --------------------------------------------- 5c) VERSION / BRAND / AI -- */
.version-row{margin-top:8px;text-align:center}
.version-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:2px 10px;border-radius:var(--radius-pill);
  border:1px solid var(--color-border);background:rgba(201,162,39,.06);
  color:var(--color-text-dim);font-size:var(--fs-xs);letter-spacing:.4px;
}
.nav-group.pinned{margin-top:6px;border-top:1px solid var(--color-line);padding-top:8px}

.login-watermark{
  position:absolute;inset-block-start:-26px;inset-inline-end:-34px;
  width:230px;opacity:.07;pointer-events:none;
}
.login-watermark svg{width:100%;height:auto}

.insights{
  margin-top:var(--sp-4);padding:var(--sp-4);
  border:1px solid var(--color-border);border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(11,61,58,.28),rgba(0,0,0,.18));
}
.insights-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.insights-title{
  display:inline-flex;align-items:center;gap:8px;
  font-weight:800;color:var(--color-gold-light);font-size:var(--fs-md);
}
.insights-title::before{
  content:"";width:6px;height:6px;border-radius:2px;background:var(--color-gold);
  box-shadow:0 0 0 4px rgba(201,162,39,.16);
}
.insights-deltas{display:flex;gap:8px;flex-wrap:wrap}
.delta{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:var(--radius-pill);
  border:1px solid var(--color-border);background:rgba(0,0,0,.2);
  font-size:var(--fs-xs);font-weight:700;color:var(--color-text-muted);
}
.delta .arrow{font-size:.7rem}
.delta.good{color:#8FE0B0;border-color:rgba(30,132,73,.55);background:rgba(30,132,73,.14)}
.delta.bad{color:#F5A79E;border-color:rgba(146,43,33,.6);background:rgba(146,43,33,.16)}
.delta.flat{color:var(--color-text-dim)}

.insight-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.insight{
  position:relative;padding:8px 12px;padding-inline-start:26px;
  border-radius:var(--radius-xs);font-size:var(--fs-sm);
  background:rgba(255,255,255,.03);border:1px solid var(--color-line);
  color:var(--color-text);
}
.insight::before{
  content:"";position:absolute;inset-inline-start:10px;inset-block-start:50%;
  width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--color-text-dim);
}
.insight.ok::before{background:#2ECC71}
.insight.info::before{background:#3498DB}
.insight.warn::before{background:#E8A33D}
.insight.danger::before{background:#E74C3C}
.insight b{color:var(--color-gold-light);white-space:nowrap}
.insight.top{background:transparent;border:none;padding-block:4px}
.insight.top::before{background:var(--color-gold);width:6px;height:6px}
.insight-block{margin-top:12px}
.insight-block-title{font-size:var(--fs-xs);color:var(--color-text-dim);margin-bottom:6px}
.insight-note{margin-top:10px;font-size:var(--fs-sm);color:var(--color-text-muted)}
.insight-note b{color:var(--color-gold-light)}

/* --------------------------------------- 5d) NAV SECTIONS & TOOLBAR POLISH -- */
.nav-section-label{
  padding:12px 12px 2px;font-size:.66rem;font-weight:800;
  letter-spacing:1.4px;color:var(--color-text-dim);
}

.today-chip{background:rgba(201,162,39,.08)}
.version-badge{
  background:rgba(11,61,58,.45);border-color:rgba(201,162,39,.35);
  color:var(--color-gold-light);font-variant-numeric:tabular-nums;letter-spacing:.3px;
}
.icon-btn{min-height:32px;padding:5px 10px;font-size:1rem;line-height:1}
.search-input{width:auto;min-width:180px;max-width:260px;flex:1 1 180px}
.chip-count{
  display:inline-flex;align-items:center;padding:2px 10px;
  border-radius:var(--radius-pill);border:1px solid var(--color-line);
  color:var(--color-text-dim);font-size:var(--fs-xs);white-space:nowrap;
}

/* colour-coded KPI cards */
.card.tone-gold .value{color:var(--color-gold-light)}
.card.tone-success .value{color:#8FE0B0}
.card.tone-danger .value{color:#F5A79E}
.card.tone-info .value{color:#93C9EC}
.card.tone-warn .value{color:#F8C471}
.card.tone-muted .value{color:var(--color-text)}
.card.tone-success::before{background:linear-gradient(90deg,#1E8449,#2ECC71,#1E8449)}
.card.tone-danger::before{background:linear-gradient(90deg,#8E2B2B,#E74C3C,#8E2B2B)}
.card.tone-info::before{background:linear-gradient(90deg,#2471A3,#3498DB,#2471A3)}
.card.tone-warn::before{background:linear-gradient(90deg,#9E7C19,#E8A33D,#9E7C19)}

@media (max-width:640px){
  .nav-section-label{padding:8px 10px 0}

}

/* -------------------------------------------------------------- 6) TABLES -- */
.table-wrap{
  overflow:auto;border:1px solid var(--color-border);
  border-radius:var(--radius-sm);background:rgba(0,0,0,.14);
}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{
  padding:11px 14px;text-align:start;
  border-bottom:1px solid var(--color-line);

}
th{
  position:sticky;top:0;z-index:2;
  background:#101716;color:var(--color-gold-light);
  font-weight:700;white-space:nowrap;

}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.014)}
tbody tr:hover td{background:rgba(201,162,39,.06)}
tbody tr:last-child td{border-bottom:none}
td .btn{min-height:30px}
tbody:empty::before{
  content:"Ù…ÙˆØ±Ø¯ÛŒ Ø¨Ø±Ø§ÛŒ Ù†Ù…Ø§ÛŒØ´ ÙˆØ¬ÙˆØ¯ Ù†Ø¯Ø§Ø±Ø¯";
  display:block;padding:26px 14px;text-align:center;
  color:var(--color-text-dim);font-size:var(--fs-sm);
}

/* ------------------------------------------------------------ 7) FEEDBACK -- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:var(--radius-pill);
  font-size:var(--fs-xs);font-weight:700;line-height:1.8;
  border:1px solid var(--color-border);color:var(--color-text-muted);
  white-space:nowrap;
}
.badge.success{color:#8FE0B0;border-color:rgba(30,132,73,.65);background:rgba(30,132,73,.16)}
.badge.warn{color:#F8C471;border-color:rgba(183,119,14,.65);background:rgba(183,119,14,.16)}
.badge.danger{color:#F5A79E;border-color:rgba(146,43,33,.7);background:rgba(146,43,33,.18)}
.badge.info{color:#93C9EC;border-color:rgba(36,113,163,.65);background:rgba(36,113,163,.16)}

.alert{
  position:relative;padding:11px 14px;margin-bottom:var(--sp-3);
  border-radius:var(--radius-sm);border:1px solid var(--color-border);
  background:rgba(255,255,255,.03);color:var(--color-text);
  font-size:var(--fs-sm);line-height:1.8;
}
.alert:last-child{margin-bottom:0}
.alert.error{background:rgba(146,43,33,.20);border-color:rgba(146,43,33,.75);color:#F7C6C0}
.alert.success{background:rgba(30,132,73,.20);border-color:rgba(30,132,73,.75);color:#B6EFCE}
.alert.info{background:rgba(36,113,163,.18);border-color:rgba(36,113,163,.65);color:#C3E1F4}
.alert.warn{background:rgba(183,119,14,.18);border-color:rgba(183,119,14,.65);color:#F7D79B}

.muted{color:var(--color-text-muted)}
.spacer{flex:1 1 auto}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
hr.sep{border:none;border-top:1px solid var(--color-line);margin:var(--sp-4) 0}


/* ---------------------------------------------------------------- 8) AUTH -- */
.splash{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at top,#123533,#0B0B0B 62%);
}
.splash-inner{text-align:center;padding:24px}
.splash-logo svg{width:152px;height:152px;filter:drop-shadow(0 14px 34px rgba(201,162,39,.22))}
.splash h1{
  margin:14px 0 4px;font-size:1.35rem;letter-spacing:1.5px;color:var(--color-gold);
}
.splash p{color:var(--color-text-muted);font-size:var(--fs-sm)}

.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 460px at 80% -10%,rgba(11,61,58,.75),transparent 60%),
    radial-gradient(700px 400px at 10% 110%,rgba(201,162,39,.10),transparent 60%),
    #08120F;
}
.login-card{
  width:100%;max-width:430px;
  background:linear-gradient(180deg,#0F211E,#0A1614);
  border:1px solid var(--color-border);border-radius:20px;
  padding:clamp(20px,3vw,30px);box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;inset-block-start:0;inset-inline:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--color-gold),transparent);
}
.login-brand{text-align:center;margin-bottom:var(--sp-5)}
.login-brand .logo{display:flex;justify-content:center}
.login-brand .logo.lockup svg{
  width:min(238px,74%);height:auto;border-radius:0;box-shadow:none;
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.45));
}
.login-brand .logo svg{
  width:88px;height:88px;border-radius:20px;
  box-shadow:0 10px 26px rgba(0,0,0,.5);
}
.login-brand h1{
  margin:12px 0 0;font-size:1.15rem;letter-spacing:1px;color:var(--color-gold);
}
.login-brand p{margin:4px 0 0;font-size:var(--fs-sm);color:var(--color-text-muted)}

/* first-run setup block (collapsible) */
.setup-details{
  margin-top:var(--sp-3);border:1px dashed rgba(201,162,39,.30);
  border-radius:var(--radius-sm);padding:10px 12px;background:rgba(201,162,39,.04);
}
.setup-details > summary{
  cursor:pointer;font-size:var(--fs-sm);font-weight:700;
  color:var(--color-text-muted);list-style:none;
}
.setup-details > summary::-webkit-details-marker{display:none}
.setup-details > summary::before{content:"â–¸ ";color:var(--color-gold)}
.setup-details[open] > summary::before{content:"â–¾ "}
.setup-details[open] > summary{color:var(--color-gold-light);margin-bottom:var(--sp-2)}
.login-hint{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:var(--fs-xs);color:var(--color-text-dim);margin-top:var(--sp-2);
}


/* ------------------------------------------------------------ 9) OVERLAYS -- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(4,6,6,.66);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  animation:fadeIn .18s var(--ease);
}
.modal{
  width:100%;max-width:760px;max-height:90vh;overflow:auto;
  background:linear-gradient(180deg,#112320,#0B1816);
  border:1px solid var(--color-border-strong);border-radius:18px;
  padding:clamp(16px,2vw,22px);box-shadow:var(--shadow-lg);
  animation:popIn .22s var(--ease);
}
.modal h3,.modal h4{
  color:var(--color-gold-light);
}
.modal h3{
  position:sticky;top:-1px;z-index:3;
  margin:calc(-1 * clamp(16px,2vw,22px)) calc(-1 * clamp(16px,2vw,22px)) var(--sp-3);
  padding:14px clamp(16px,2vw,22px);
  background:linear-gradient(180deg,#142925,#112320);
  border-bottom:1px solid var(--color-border);
  font-size:var(--fs-lg);
}
.modal h4{
  margin:var(--sp-4) 0 var(--sp-2);font-size:var(--fs-md);
  display:flex;align-items:center;gap:8px;
}
.modal h4::before{
  content:"";width:4px;height:14px;border-radius:99px;background:var(--color-gold);
}
.modal .row:last-child{
  position:sticky;bottom:calc(-1 * clamp(16px,2vw,22px));
  margin:var(--sp-4) calc(-1 * clamp(16px,2vw,22px)) calc(-1 * clamp(16px,2vw,22px));
  padding:12px clamp(16px,2vw,22px);
  background:linear-gradient(180deg,rgba(17,35,32,.85),#112320);
  border-top:1px solid var(--color-border);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
}

/* toast stack */
#toast{
  position:fixed;inset-block-end:18px;inset-inline-start:18px;z-index:120;
  display:flex;flex-direction:column;gap:8px;
  max-width:min(92vw,380px);pointer-events:none;
}
#toast > .alert{
  margin:0;pointer-events:auto;
  box-shadow:var(--shadow);
  border-inline-start:3px solid var(--color-gold);
  animation:slideIn .22s var(--ease);
  transition:opacity .2s var(--ease),transform .2s var(--ease);
}
#toast > .alert.error{border-inline-start-color:#E74C3C}
#toast > .alert.success{border-inline-start-color:#2ECC71}
#toast > .alert.info{border-inline-start-color:#3498DB}
#toast > .alert.hide{opacity:0;transform:translateY(6px)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}


/* ------------------------------------------- 9b) INVOICE FORM (0.4.2) -- */
.inv-form{display:flex;flex-direction:column;gap:var(--sp-4)}
.form-section{
  padding:var(--sp-3) var(--sp-4);
  background:rgba(0,0,0,.16);
  border:1px solid var(--color-line);
  border-radius:var(--radius);
}
.form-section-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:var(--sp-3)}
.form-section-head h4{
  margin:0;font-size:var(--fs-md);color:var(--color-gold-light);
  display:flex;align-items:center;gap:8px;
}
.form-section-head h4::before{content:none}
.form-section-head p{margin:2px 0 0}
.form-section-head .step{
  flex:0 0 auto;display:grid;place-items:center;
  width:24px;height:24px;border-radius:50%;
  background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.45);
  color:var(--color-gold-light);font-size:var(--fs-xs);font-weight:800;
}
.req{color:#F5A79E;font-weight:800}
.form-span{grid-column:1 / -1}

.items-list{display:flex;flex-direction:column;gap:8px;margin-bottom:var(--sp-3)}
.item-row{
  display:grid;grid-template-columns:minmax(220px,2.4fr) 88px minmax(130px,1fr) minmax(130px,1fr) 38px;
  gap:var(--sp-2);align-items:start;
  padding:10px;border:1px solid var(--color-line);border-radius:var(--radius-sm);
  background:rgba(255,255,255,.02);
}
.item-field{display:flex;flex-direction:column;min-width:0}
.item-field label{font-size:var(--fs-xs);margin-bottom:4px}
.item-field input,.item-field select{width:100%}
.item-name{
  margin-top:5px;font-size:var(--fs-xs);color:var(--color-gold-light);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item-desc{margin-top:6px;font-size:var(--fs-sm)}
.item-line-total .line-total{
  min-height:38px;display:flex;align-items:center;justify-content:flex-start;
  font-weight:800;color:var(--color-ivory);font-variant-numeric:tabular-nums;
}
.item-del{min-height:38px;width:38px;padding:0;display:grid;place-items:center;font-size:.9rem}
.item-del:hover{transform:none}

.new-customer-panel{
  margin-top:var(--sp-2);padding:var(--sp-3);
  border:1px dashed rgba(201,162,39,.45);border-radius:var(--radius-sm);
  background:rgba(201,162,39,.05);
}
.new-customer-panel[hidden]{display:none}

.inv-summary{
  padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--color-border-strong);border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(11,61,58,.35),rgba(0,0,0,.2));
}
.sum-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 0;font-size:var(--fs-sm);color:var(--color-text-muted);
  border-bottom:1px dashed rgba(255,255,255,.06);
}
.sum-row b{color:var(--color-ivory);font-variant-numeric:tabular-nums;font-size:var(--fs-md)}
.sum-row.total{
  border-bottom:none;margin-top:6px;padding-top:10px;

}
.sum-row.total b{font-size:1.15rem;color:var(--color-gold-light)}
.sum-row[hidden]{display:none}
.sum-note{margin-top:8px}
.modal.modal-wide{max-width:980px}

@media (max-width:900px){
  .item-row{grid-template-columns:1fr 1fr}
  .item-service{grid-column:1 / -1}
  .item-del{width:100%}
}
@media (max-width:640px){
  .item-row{grid-template-columns:1fr}
  .form-section{padding:var(--sp-3)}

  .sum-row b{font-size:var(--fs-sm)}

}

/* --------------------------------------- 9c) UNIFIED CONTROLS (0.4.3) -- */
html{font-family:var(--font)}
body,button,input,select,textarea,option{font-family:var(--font)}
select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  padding-inline-end:34px;cursor:pointer;
  background-color:#0F1414;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A227' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:left 10px center;background-size:14px 14px;
}
select option{background:#0F1414;color:var(--color-text)}
input[type="date"],input[type="time"]{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
input[type="date"]::-webkit-calendar-picker-indicator{
  filter:invert(78%) sepia(38%) saturate(520%) hue-rotate(1deg) brightness(95%);
  cursor:pointer;opacity:.85;
}
input[type="checkbox"]{width:18px;height:18px;min-height:18px;padding:0;accent-color:var(--color-gold);cursor:pointer}
input[type="number"]{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{opacity:.35}

/* machine-readable values (invoice no, ids, phones) stay LTR and isolated so
   digits and Latin characters never mix with the RTL text flow */
.ltr-num,.ltr-code{direction:ltr;unicode-bidi:isolate;text-align:left;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
code,.mono{direction:ltr;unicode-bidi:isolate;font-family:"Cascadia Mono",Consolas,monospace;
  font-size:.82em;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}

/* danger zone (settings) */
.danger-zone{border-color:rgba(192,57,43,.55);background:linear-gradient(180deg,rgba(94,27,27,.18),rgba(0,0,0,.18))}
.danger-zone h2{color:#F5A79E}
.wipe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--sp-3);margin-top:var(--sp-2)}
.wipe-title{font-weight:800;color:var(--color-gold-light);margin-bottom:6px;font-size:var(--fs-sm)}
.wipe-list{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.wipe-list li{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm);
  padding:5px 9px;border:1px solid var(--color-line);border-radius:var(--radius-xs);background:rgba(0,0,0,.18)}
.wipe-list b{color:var(--color-ivory)}

/* print preview inside the modal (white sheet on the dark UI) */
.print-preview{background:#e9edec;border-radius:var(--radius-sm);padding:10px;max-height:64vh;overflow:auto}
.print-preview .sheet{width:100%;max-width:190mm;margin:0 auto;background:#fff;color:#12201E;
  padding:10mm 9mm;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:6px}
.print-preview table{width:100%;border-collapse:collapse;min-width:0}
.print-preview th,.print-preview td{border:1px solid #d8dfdc;padding:6px;font-size:.8rem;color:#12201E;background:none;position:static}
.print-preview th{background:#0B3D3A;color:#fff}
.print-preview .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:10px 0;font-size:.82rem}
.print-preview .totals{margin-inline-start:auto;width:70mm}
.print-preview .t-row{display:flex;justify-content:space-between;padding:4px 6px;font-size:.82rem}
.print-preview .brand{display:flex;gap:10px;align-items:center;border-bottom:2px solid #C9A227;padding-bottom:8px}
.print-preview .brand-mark svg{width:52px;height:52px}
.print-preview .brand-name{font-size:1.05rem;font-weight:800;color:#0B3D3A}
.print-preview .brand-meta{font-size:.75rem;margin-inline-start:auto;text-align:left;line-height:1.8}
.print-preview .void-note{color:#8c2a20;border:1px solid #b23b2e;background:#fdecea;padding:6px 8px;border-radius:6px;margin-top:8px;font-weight:700}


@media (max-width:1100px){

  .grid.cards{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
}
