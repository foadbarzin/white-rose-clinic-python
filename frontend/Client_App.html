<script>
(function(){
  var state = {
    token: sessionStorage.getItem('wrc_token') || '',
    user: null,
    appVersion: window.WRC_APP_VERSION || '',
    route: 'dashboard',
    cache: {},
    loading: false,
    calendar: null,
    invFilter: null,
    reportRange: null,
    reportTab: 'summary'
  };

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtMoney(n){ n = Number(n||0); if(isNaN(n)) n=0; return n.toLocaleString('fa-IR') + ' تومان'; }
  function fmtNum(n){ n=Number(n||0); if(isNaN(n)) n=0; return n.toLocaleString('fa-IR'); }

  /* Calendar info comes from the server (Asia/Tehran + Jalali month + Saturday week)
     so the UI never guesses the clinic timezone. */
  function ensureCalendar(){
    if (state.calendar) return Promise.resolve(state.calendar);
    return api('system.calendar', {}).then(function(c){
      state.calendar = c || {};
      return state.calendar;
    }).catch(function(){
      var t = todayIso();
      state.calendar = { today: t, week_start: t, month_start: monthStart(t), month_end: t, jalali_label: '', week_label: 'شنبه‌محور', month_label: '' };
      return state.calendar;
    });
  }
  function invoiceStatusLabel(s){
    var map = {
      draft:'پیش‌نویس', pending_discount_approval:'در انتظار تأیید تخفیف', issued:'صادرشده',
      partially_paid:'پرداخت ناقص', paid:'پرداخت‌شده', void:'باطل‌شده',
      calculated:'محاسبه‌شده', payable:'قابل پرداخت', adjusted:'تعدیل‌شده',
      requested:'درخواست‌شده', approved:'تأییدشده', rejected:'ردشده', none:'—'
    };
    return map[s] || s || '-';
  }
  function badge(text, type){ return '<span class="badge '+(type||'')+'">'+esc(text)+'</span>'; }
  function todayIso(){ var d=new Date(); var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),da=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+da; }
  // Jalali (Shamsi) date label for UI display; falls back to ISO when Intl is unavailable.
  function todayLabel(){
    try { return new Date().toLocaleDateString('fa-IR', { year:'numeric', month:'long', day:'numeric' }); }
    catch(e){ return todayIso(); }
  }
  function initial(u){ var s = (u && (u.display_name || u.username)) || '?'; return String(s).trim().charAt(0); }

  /* ---- dashboard period helpers (daily / weekly / monthly + custom range) ---- */
  function isoAddDays(iso, days){
    var d = new Date(String(iso) + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + Number(days || 0));
    return d.toISOString().substring(0, 10);
  }
  function monthStart(iso){ return String(iso).substring(0, 8) + '01'; }
  function dashRange(){
    if (!state.range) {
      var to = todayIso();
      state.range = { from: monthStart(to), to: to, granularity: 'day', preset: 'month' };
    }
    return state.range;
  }
  function applyDashPreset(id){
    var to = todayIso(), from = to;
    if (id === '7d') from = isoAddDays(to, -6);
    else if (id === '30d') from = isoAddDays(to, -29);
    else if (id === 'month') from = monthStart(to);
    var cur = dashRange();
    state.range = { from: from, to: to, granularity: cur.granularity || 'day', preset: id };
    loadRoute('dashboard');
  }
  function faDate(iso){
    try { return new Date(String(iso) + 'T00:00:00').toLocaleDateString('fa-IR', { year:'numeric', month:'2-digit', day:'2-digit' }); }
    catch(e){ return String(iso || ''); }
  }
  function compactMoney(n){
    n = Number(n || 0);
    var neg = n < 0; n = Math.abs(n);
    function f(x){ return Number(Math.round(x * 10) / 10).toLocaleString('fa-IR'); }
    var s;
    if (n >= 1e9) s = f(n / 1e9) + ' میلیارد';
    else if (n >= 1e6) s = f(n / 1e6) + ' میلیون';
    else if (n >= 1e3) s = f(n / 1e3) + ' هزار';
    else s = fmtNum(n);
    return (neg ? '−' : '') + s;
  }
  function bucketLabelFa(key, gran){
    try {
      if (gran === 'month') {
        return new Date(String(key) + '-01T00:00:00').toLocaleDateString('fa-IR', { year:'numeric', month:'2-digit' });
      }
      return new Date(String(key) + 'T00:00:00').toLocaleDateString('fa-IR', { month:'2-digit', day:'2-digit' });
    } catch(e){ return String(key || ''); }
  }
  /* ---- version chip ---- */
  function applyVersion(v){
    if (v) state.appVersion = String(v);
    if (!state.appVersion && window.WRC_APP_VERSION) state.appVersion = String(window.WRC_APP_VERSION);
    if (!state.appVersion) return;
    var label = 'v' + state.appVersion;
    $all('.js-app-version').forEach(function(el){ el.textContent = label; });
    try { document.title = 'ROSE SEFID BEAUTY CLINIC · ' + label; } catch(e){}
  }
  /* ---- smart insights ---- */
  function deltaChip(label, pct, goodWhenUp){
    if (pct === undefined) return '';
    var v = (pct === null) ? null : Number(pct);
    var cls = 'flat', arrow = '•', txt = '—';
    if (v === null) { txt = 'جدید'; }
    else {
      txt = Math.abs(v).toLocaleString('fa-IR') + '٪';
      if (v > 0) { arrow = '▲'; cls = goodWhenUp ? 'good' : 'bad'; }
      else if (v < 0) { arrow = '▼'; cls = goodWhenUp ? 'bad' : 'good'; }
    }
    return '<span class="delta ' + cls + '">' + esc(label) + ' <span class="arrow">' + arrow + '</span> ' + txt + '</span>';
  }
  function insightsHtml(ins){
    if (!ins) return '';
    var alerts = (ins.alerts || []).map(function(a){
      var amount = Number(a.amount || 0);
      return '<li class="insight ' + esc(a.level || 'info') + '">' + esc(a.text) + (amount ? ' <b>' + fmtMoney(amount) + '</b>' : '') + '</li>';
    }).join('');
    var tops = (ins.top_services || []).map(function(s){
      return '<li class="insight top">' + esc(s.name) + ' <span class="muted small">(' + fmtNum(s.quantity) + ' مورد)</span> <b>' + fmtMoney(s.amount) + '</b></li>';
    }).join('');
    return '<div class="insights">' +
      '<div class="insights-head">' +
        '<span class="insights-title">تحلیل هوشمند</span>' +
        '<span class="insights-deltas">' +
          deltaChip('درآمد', ins.deltas && ins.deltas.income, true) +
          deltaChip('هزینه', ins.deltas && ins.deltas.expense, false) +
          deltaChip('خالص', ins.deltas && ins.deltas.net, true) +
        '</span>' +
      '</div>' +
      '<ul class="insight-list">' + alerts + '</ul>' +
      (tops ? '<div class="insight-block"><div class="insight-block-title">پرفروش‌ترین خدمات بازه</div><ul class="insight-list">' + tops + '</ul></div>' : '') +
      (ins.best_day ? '<div class="insight-note">بهترین روز بازه: <b>' + esc(ins.best_day.label) + '</b> با ' + fmtMoney(ins.best_day.income) + ' درآمد</div>' : '') +
      '<div class="insight-note muted small">مقایسه با بازه قبل: ' + esc(faDate(ins.previous_from || '')) + ' تا ' + esc(faDate(ins.previous_to || '')) + '</div>' +
    '</div>';
  }
  /* Lightweight inline SVG chart (no external libraries - works inside Apps Script). */
  function chartSvg(d){
    var buckets = (d && d.buckets) || [];
    var gran = (d && d.granularity) || 'day';
    if (!buckets.length) return '<div class="chart-empty">داده‌ای برای این بازه وجود ندارد.</div>';
    var hasData = false;
    buckets.forEach(function(b){ if (Number(b.income || 0) || Number(b.expense || 0)) hasData = true; });
    if (!hasData) return '<div class="chart-empty">در این بازه تراکنشی ثبت نشده است.</div>';

    var W = 920, H = 320, pl = 72, pr = 18, pt = 16, pb = 46;
    var iw = W - pl - pr, ih = H - pt - pb, base = pt + ih;
    var max = 0;
    buckets.forEach(function(b){ max = Math.max(max, Number(b.income || 0), Number(b.expense || 0)); });
    if (max <= 0) max = 1;
    var mag = Math.pow(10, Math.floor(Math.log(max) / Math.LN10));
    var step = mag / 2;
    max = Math.ceil(max / step) * step;

    var n = buckets.length, slot = iw / n;
    var bw = Math.max(2.5, Math.min(26, slot * 0.33));
    function yv(v){ return pt + ih - (ih * (Math.max(0, Number(v || 0)) / max)); }

    var parts = [];
    for (var gi = 0; gi <= 4; gi++) {
      var val = max * gi / 4, yy = yv(val);
      parts.push('<line class="chart-grid" x1="' + pl + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + yy.toFixed(1) + '"/>');
      parts.push('<text class="chart-axis" x="' + (pl - 10) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + esc(compactMoney(val)) + '</text>');
    }

    var bars = [], netPts = [];
    var every = Math.max(1, Math.ceil(n / 14));
    buckets.forEach(function(b, i){
      var cx = pl + slot * i + slot / 2;
      var inc = Number(b.income || 0), exp = Number(b.expense || 0);
      var yi = yv(inc), hi = base - yi;
      var ye = yv(exp), he = base - ye;
      var xi = cx - bw - 1.5, xe = cx + 1.5;
      var lbl = bucketLabelFa(b.key, gran);
      var tip = lbl + ' — درآمد: ' + fmtMoney(inc) + ' | هزینه: ' + fmtMoney(exp) + ' | خالص: ' + fmtMoney(b.net);
      bars.push('<g><title>' + esc(tip) + '</title>');
      if (hi >= 0.5) bars.push('<rect class="chart-bar income" x="' + xi.toFixed(1) + '" y="' + yi.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hi.toFixed(1) + '" rx="2.5"/>');
      if (he >= 0.5) bars.push('<rect class="chart-bar expense" x="' + xe.toFixed(1) + '" y="' + ye.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + he.toFixed(1) + '" rx="2.5"/>');
      bars.push('</g>');
      netPts.push(cx.toFixed(1) + ',' + yv(b.net).toFixed(1));
      if (i % every === 0) {
        bars.push('<text class="chart-axis x" x="' + cx.toFixed(1) + '" y="' + (base + 24) + '" text-anchor="middle">' + esc(lbl) + '</text>');
      }
    });

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="نمودار درآمد و هزینه">' +
      '<defs>' +
        '<linearGradient id="chartGold" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#F0D97A"/>' +
          '<stop offset="100%" stop-color="#C9A227"/>' +
        '</linearGradient>' +
      '</defs>' +
      parts.join('') +
      '<line class="chart-base" x1="' + pl + '" y1="' + base + '" x2="' + (W - pr) + '" y2="' + base + '"/>' +
      bars.join('') +
      (netPts.length > 1 ? '<polyline class="chart-net" points="' + netPts.join(' ') + '"/>' : '') +
      '</svg>';
  }

  function logoHtml(){
    return (typeof WRC_LOGO_HTML === 'string') ? WRC_LOGO_HTML : '';
  }
  function logoMarkHtml(){
    return (typeof WRC_LOGO_MARK_HTML === 'string') ? WRC_LOGO_MARK_HTML : logoHtml();
  }

  function hasPerm(code){
    if(!state.user) return false;
    var perms = state.user.permissions;
    if(Array.isArray(perms)) return perms.indexOf(code) >= 0;
    return state.user.role === 'admin';
  }

  function api(action, payload){
    return new Promise(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){
          if(res && res.ok) resolve(res.data);
          else {
            var err = res && res.error ? res.error : {message:'خطای نامشخص'};
            if(err.code === 'UNAUTHORIZED' || err.code === 'PASSWORD_CHANGE_REQUIRED'){
              if(err.code === 'UNAUTHORIZED'){
                setToken(''); state.user = null;
                toast(err.message || 'نشست منقضی شده است. دوباره وارد شوید.', 'error');
                setTimeout(function(){ render(); }, 120);
              }
            }
            reject(err);
          }
        })
        .withFailureHandler(function(err){
          reject({code:'CLIENT', message: (err && err.message) ? err.message : 'خطا در ارتباط با سرور'});
        })
        .apiCall(action, payload || {}, state.token || '');
    });
  }

  function setToken(t){ state.token = t||''; if(t) sessionStorage.setItem('wrc_token', t); else sessionStorage.removeItem('wrc_token'); }

  function toast(msg, type){
    var el = $('#toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.setAttribute('role','status');
      el.setAttribute('aria-live','polite');
      document.body.appendChild(el);
    }
    var item = document.createElement('div');
    item.className = 'alert ' + (type||'info');
    item.textContent = msg;
    el.appendChild(item);
    setTimeout(function(){
      try{ item.classList.add('hide'); }catch(e){}
      setTimeout(function(){ try{ el.removeChild(item); }catch(e){} }, 220);
    }, 3400);
  }

  /* Flat, single-level navigation: every top item shares the same weight,
     spacing and icon size; sub-items are indented under their parent. */
  var routes = [
    {id:'dashboard', title:'داشبورد', icon:'dashboard', roles:['admin','operator','doctor']},
    {id:'invoices', title:'ثبت فاکتور', icon:'invoice', roles:['admin','operator','doctor']},
    {id:'operations', title:'مدیریت عملیات', icon:'operations', roles:['admin','operator','doctor'], children:[
      {id:'customers', title:'مشتریان', roles:['admin','operator','doctor']},
      {id:'commissions', title:'پورسانت‌ها', roles:['admin']},
      {id:'expenses', title:'هزینه‌ها', roles:['admin','operator']}
    ]},
    {id:'reports', title:'گزارش‌ها', icon:'reports', roles:['admin']},
    {id:'access', title:'دسترسی‌ها', icon:'users', roles:['admin'], children:[
      {id:'roles', title:'نقش‌ها و مجوزها', roles:['admin']},
      {id:'audit', title:'گزارش رویدادها', roles:['admin']}
    ]},
    {id:'definitions', title:'تعاریف پایه', icon:'definitions', roles:['admin'], children:[
      {id:'doctors', title:'تعریف پزشک', roles:['admin']},
      {id:'operators', title:'تعریف اپراتور', roles:['admin']},
      {id:'services', title:'تعریف خدمات', roles:['admin']},
      {id:'commissionRules', title:'تعریف پورسانت', roles:['admin']}
    ]},
    {id:'revenue', title:'درآمدهای متفرقه', icon:'revenue', roles:['admin']},
    {id:'users', title:'کاربران', icon:'users', roles:['admin']},
    {id:'settings', title:'تنظیمات', icon:'settings', roles:['admin']}
  ];

  var NAV_ICONS = {
    dashboard: '<path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"/>',
    invoice: '<path d="M6 2h9l4 4v16l-3-2-3 2-3-2-3 2V4a2 2 0 0 1 2-2z"/><path d="M9 8h7M9 12h7M9 16h4"/>',
    operations: '<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2.4"/>',
    reports: '<path d="M3 21h18"/><path d="M6 21V11M11 21V5M16 21v-7M21 21V9"/>',
    definitions: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h9M17 18h3"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="18" r="2"/>',
    revenue: '<path d="M3 7h18v12H3z"/><path d="M3 7l9-4 9 4"/><circle cx="12" cy="13" r="2.2"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M17.5 20a6 6 0 0 0-2.2-4.6"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
  };
  function navIcon(name){
    var body = NAV_ICONS[name] || '<circle cx="12" cy="12" r="8"/>';
    return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+body+'</svg>';
  }

  function routeMeta(routeId){
    for (var i = 0; i < routes.length; i++) {
      var r = routes[i];
      if (r.children && r.children.length) {
        for (var j = 0; j < r.children.length; j++) {
          if (r.children[j].id === routeId) return r.children[j];
        }
      } else if (r.id === routeId) {
        return r;
      }
    }
    return null;
  }
  function allowed(routeId){
    var r = routeMeta(routeId);
    if(!r || !state.user) return false;
    return r.roles.indexOf(state.user.role) >= 0;
  }
  function render(){
    var app = $('#app');
    if(!state.token || !state.user){ renderLogin(app); applyVersion(); return; }
    renderShell(app);
    applyVersion();
  }

  function renderLogin(app){
    app.innerHTML =
      '<div class="login-wrap"><div class="login-card">'+
      '<div class="login-watermark" aria-hidden="true">'+logoMarkHtml()+'</div>'+
      '<div class="login-brand"><div class="logo lockup">'+logoHtml()+'</div><p>سامانه مدیریت کلینیک رز سفید</p></div>'+
      '<div id="loginAlert"></div>'+
      '<div class="form-group"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>'+
      '<div class="form-group"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>'+
      '<div class="row"><button class="btn gold block" id="loginBtn">ورود به سامانه</button></div>'+
      '<div class="login-hint"><span>ورود با نام کاربری و رمز عبور</span><span class="js-app-version">—</span></div>'+
      '<div class="muted small" style="margin-top:10px">راه‌اندازی اولیهٔ سیستم فقط توسط مالک از ابزار مدیریت سرور انجام می‌شود.</div>'+
      '</div></div>';
    $('#loginBtn').onclick = doLogin;
    $('#loginPass').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ doLogin(); } });
    $('#loginUser').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ $('#loginPass').focus(); } });
  }

  function renderShell(app){
    var navHtml = '';
    routes.forEach(function(r){
      var kids = (r.children || []).filter(function(c){ return allowed(c.id); });
      var childActive = kids.some(function(c){ return c.id === state.route; });
      if (kids.length) {
        navHtml += '<div class="nav-group' + (childActive ? ' open' : '') + '">' +
          '<button type="button" class="nav-item nav-parent' + (childActive ? ' is-open' : '') + '" aria-expanded="' + (childActive ? 'true' : 'false') + '">' +
            '<span class="nav-ico">' + navIcon(r.icon) + '</span>' +
            '<span class="nav-label">' + esc(r.title) + '</span>' +
            '<span class="chev" aria-hidden="true">▾</span>' +
          '</button>' +
          '<div class="nav-sub">' +
            kids.map(function(c){
              var on = state.route === c.id;
              return '<button type="button" data-route="' + c.id + '" class="nav-item nav-child' + (on ? ' active' : '') + '"' + (on ? ' aria-current="page"' : '') + '>' +
                '<span class="nav-dot" aria-hidden="true"></span>' +
                '<span class="nav-label">' + esc(c.title) + '</span>' +
              '</button>';
            }).join('') +
          '</div>' +
        '</div>';
      } else if (allowed(r.id)) {
        navHtml += '<button type="button" data-route="' + r.id + '" class="nav-item' + (state.route === r.id ? ' active' : '') + '"' + (state.route === r.id ? ' aria-current="page"' : '') + '>' +
          '<span class="nav-ico">' + navIcon(r.icon) + '</span>' +
          '<span class="nav-label">' + esc(r.title) + '</span>' +
        '</button>';
      }
    });
    app.innerHTML =
      '<div class="app-shell">'+
        '<aside class="sidebar">'+
          '<div class="brand"><div class="logo">'+logoMarkHtml()+'</div><div><div class="title">ROSE SEFID</div><div class="subtitle">BEAUTY CLINIC</div></div></div>'+
          '<nav class="nav">'+navHtml+'</nav>'+
          '<div class="sidebar-footer">'+
            '<div class="user-chip"><span class="avatar">'+esc(initial(state.user))+'</span>'+
              '<span class="user-meta"><span class="user-name">'+esc(state.user.display_name||state.user.username)+'</span>'+
              '<span class="user-role">'+esc(roleLabel(state.user.role))+'</span></span></div>'+
            '<button class="btn secondary sm block" id="logoutBtn">خروج</button>'+
            '<button class="btn secondary sm block" id="logoutAllBtn" style="margin-top:6px">خروج از همه دستگاه‌ها</button>'+
            '<div class="version-row"><span class="version-chip">نسخه <span class="js-app-version">—</span></span></div>'+
          '</div>'+
        '</aside>'+
        '<main class="main">'+
          '<div class="topbar">'+
            '<div class="page-title-wrap"><span class="topbar-logo" aria-hidden="true">'+logoMarkHtml()+'</span>'+
              '<div class="page-title" id="pageTitle"></div></div>'+
            '<div class="user">'+
              '<span class="badge version-badge" title="نسخه برنامه"><span class="js-app-version">—</span></span>'+
              '<span class="badge today-chip" title="تاریخ امروز">'+esc(todayLabel())+'</span>'+
              '<button type="button" class="btn secondary sm icon-btn" id="refreshBtn" title="به‌روزرسانی" aria-label="به‌روزرسانی">⟳</button>'+
              '<span class="badge info">'+esc(roleLabel(state.user.role))+'</span>'+
              '<span class="avatar">'+esc(initial(state.user))+'</span>'+
              '<span>'+esc(state.user.username)+'</span>'+
            '</div></div>'+
          '<div class="content" id="content"><div class="panel">در حال بارگذاری...</div></div>'+
        '</main>'+
      '</div>';
    $all('.nav-parent').forEach(function(b){
      b.onclick = function(){
        var g = b.parentNode;
        var willOpen = !g.classList.contains('open');
        // Only one submenu may stay open at a time.
        $all('.nav-group').forEach(function(other){
          if (other === g) return;
          other.classList.remove('open');
          var otherBtn = other.querySelector('.nav-parent');
          if (otherBtn) { otherBtn.classList.remove('is-open'); otherBtn.setAttribute('aria-expanded', 'false'); }
        });
        g.classList.toggle('open', willOpen);
        b.classList.toggle('is-open', willOpen);
        b.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      };
    });
    $all('.nav button[data-route]').forEach(function(b){ b.onclick = function(){ navigate(b.getAttribute('data-route')); }; });
    var refreshBtn = $('#refreshBtn');
    if (refreshBtn) refreshBtn.onclick = function(){ loadRoute(state.route); toast('به‌روزرسانی شد', 'success'); };
    $('#logoutBtn').onclick = doLogout;

  function roleLabel(r){ return r==='admin'?'مدیر':(r==='operator'?'اپراتور':(r==='doctor'?'پزشک':r)); }
  function navigate(routeId){
    if(!allowed(routeId)) routeId='dashboard';
    state.route = routeId;
    $all('.nav button[data-route]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-route')===routeId); });
    $all('.nav-group').forEach(function(g){
      var inside = $all('button[data-route]', g).some(function(b){ return b.getAttribute('data-route')===routeId; });
      if (inside) g.classList.add('open');
      else g.classList.remove('open');
      var parentBtn = g.querySelector('.nav-parent');
      if (parentBtn) {
        parentBtn.classList.toggle('is-open', inside);
        parentBtn.setAttribute('aria-expanded', inside ? 'true' : 'false');
      }
    });
    var r = routeMeta(routeId);
    if($('#pageTitle')) $('#pageTitle').textContent = r ? r.title : '';

  function simpleCrudView(opts){
    return api(opts.list,{}).then(function(rows){
      rows = rows || [];
      var canManage = opts.canManage();
      var cols = opts.columns;
      function cellValue(r, c){ return (typeof c.value === 'function') ? c.value(r) : r[c.key]; }
      function rowHtml(r){
        return '<tr>' + cols.map(function(c){ var v = cellValue(r, c); var cls = (c.key === 'mobile' || c.ltr) ? ' class="ltr-num"' : ''; return '<td'+cls+'>'+esc(v==null?'':v)+'</td>'; }).join('') +
          (canManage ? '<td><button class="btn sm secondary" data-edit="'+esc(r.id)+'">ویرایش</button></td>' : '') + '</tr>';
      }
      function bindRows(){
        if(!canManage) return;
        $all('[data-edit]').forEach(function(b){
          b.onclick = function(){
            var id = b.getAttribute('data-edit');
            var r = rows.filter(function(x){ return x.id === id; })[0];
            opts.openModal(r, rows);
          };
        });
      }
      function paint(q){
        var list = rows.filter(function(r){
          if(!q) return true;
          return cols.some(function(c){ var v = cellValue(r, c); return String(v == null ? '' : v).toLowerCase().indexOf(q) >= 0; });
        });
        $('#crudBody').innerHTML = list.map(rowHtml).join('');
        $('#crudCount').textContent = fmtNum(list.length) + ' از ' + fmtNum(rows.length);
        bindRows();
      }
      $('#content').innerHTML = '<div class="panel"><div class="panel-header"><h2>'+esc(opts.title)+'</h2>'+
        '<div class="toolbar">'+
          '<input id="crudSearch" class="input-sm search-input" type="search" placeholder="جستجو…" aria-label="جستجو در جدول">'+
          '<span class="chip-count" id="crudCount"></span>'+
          (canManage?'<button class="btn gold sm" id="addBtn">جدید</button>':'')+
        '</div></div>'+
        '<div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c.label)+'</th>';}).join('')+(canManage?'<th>عملیات</th>':'')+'</tr></thead><tbody id="crudBody"></tbody></table></div></div>';
      paint('');
      $('#crudSearch').addEventListener('input', function(){ paint(this.value.trim().toLowerCase()); });
      if(canManage) $('#addBtn').onclick = function(){ opts.openModal(null, rows); };
    });
  }

  /* --------------------------------------------------------- data maintenance --

     wipe. Both endpoints are admin-only on the server as well. ---------------- */
  function downloadJson(name, obj){
    var text = JSON.stringify(obj, null, 2);
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); try { document.body.removeChild(a); } catch (e) {} }, 1500);
  }

/**
   * Invoice form (redesigned in 0.4.2).
   * Order: 1) header data (date, customer, doctor, operator) 2) line items
   * 3) discount (amount or percent + note) and a live, server-verified summary.
   */
  function openInvoiceModal(row, customers, doctors, services, operators){
    row = row || {};
    var isAdmin = state.user.role === 'admin';
    var canCreateCustomer = state.user.role === 'admin' || state.user.role === 'operator';
    var defaultDate = (state.calendar && state.calendar.today) || todayIso();
    var items = (row.items && row.items.length ? row.items : [{ service_id:'', quantity:1, unit_price_toman:0, description:'' }])
      .map(function(it){
        return {
          service_id: it.service_id || '',
          quantity: Number(it.quantity || 1) || 1,
          unit_price_toman: Number(it.unit_price_toman || 0) || 0,
          description: it.description || ''
        };
      });
    var discMode = 'amount';
    var discValue = Number(row.discount_requested_toman || 0) || 0;
    var previewSeq = 0, previewTimer = null;

    function svcById(id){
      for (var i = 0; i < services.length; i++) { if (String(services[i].id) === String(id)) return services[i]; }
      return null;
    }
    function lineGross(it){ return Math.max(0, Math.round(Number(it.quantity || 0) * Number(it.unit_price_toman || 0))); }
    function localSubtotal(){ var s = 0; for (var i = 0; i < items.length; i++) { s += lineGross(items[i]); } return s; }
    function discountAmount(sub){
      if (discMode === 'percent') {
        var pct = Math.max(0, Math.min(100, Number(discValue || 0)));
        return Math.round(sub * pct / 100);
      }
      return Math.max(0, Math.min(sub, Math.round(Number(discValue || 0))));
    }
    function opts(list, selected, placeholder){
      var out = '<option value="">' + placeholder + '</option>';
      (list || []).forEach(function(x){
        out += '<option value="' + esc(x.id) + '"' + (String(x.id) === String(selected) ? ' selected' : '') + '>' + esc(x.full_name) + '</option>';
      });
      return out;
    }
    function serviceOptions(selected){
      var out = '<option value="">— انتخاب خدمت —</option>';
      (services || []).forEach(function(s){
        out += '<option value="' + esc(s.id) + '"' + (String(s.id) === String(selected) ? ' selected' : '') + '>' + esc(s.name) + '</option>';
      });
      return out;
    }
    function itemRow(it, i){
      var svc = svcById(it.service_id);
      return '<div class="item-row" data-row="' + i + '">' +
        '<div class="item-field item-service">' +
          '<label for="ivsvc' + i + '">خدمت</label>' +
          '<select id="ivsvc' + i + '" data-i="' + i + '" data-k="service_id">' + serviceOptions(it.service_id) + '</select>' +
          '<div class="item-name' + (svc ? '' : ' muted') + '" data-name="' + i + '">' + esc(svc ? svc.name : 'خدمتی انتخاب نشده') + '</div>' +
          '<input class="item-desc" data-i="' + i + '" data-k="description" placeholder="شرح این ردیف (اختیاری)" value="' + esc(it.description || '') + '">' +
        '</div>' +
        '<div class="item-field item-qty"><label for="ivqty' + i + '">تعداد</label>' +
          '<input id="ivqty' + i + '" type="number" min="1" step="1" inputmode="numeric" data-i="' + i + '" data-k="quantity" value="' + esc(it.quantity) + '"></div>' +
        '<div class="item-field item-price"><label for="ivprice' + i + '">مبلغ واحد (تومان)</label>' +
          '<input id="ivprice' + i + '" type="number" min="0" step="1000" inputmode="numeric" data-i="' + i + '" data-k="unit_price_toman" value="' + esc(it.unit_price_toman) + '"></div>' +
        '<div class="item-field item-line-total"><label>جمع ردیف</label><div class="line-total" data-line="' + i + '">' + fmtMoney(lineGross(it)) + '</div></div>' +
        '<button type="button" class="btn sm danger item-del" data-del="' + i + '" title="حذف این ردیف" aria-label="حذف ردیف ' + (i + 1) + '">✕</button>' +
      '</div>';
    }
    function formHtml(){
      return '<h3>ثبت فاکتور جدید</h3>' +
        '<div class="inv-form">' +
          '<div id="ivAlert" role="alert"></div>' +
          '<section class="form-section">' +
            '<div class="form-section-head"><span class="step">۱</span><div><h4>اطلاعات اولیه</h4>' +
              '<p class="muted small">تاریخ فاکتور، مشتری، پزشک و اپراتور</p></div></div>' +
            '<div class="form-grid">' +
              '<div class="form-group"><label for="iv_date">تاریخ فاکتور <span class="req">*</span></label>' +
                '<input id="iv_date" type="date" value="' + esc(row.invoice_date || defaultDate) + '"></div>' +
              (canCreateCustomer ? '<div class="form-group"><label>مشتری جدید</label>' +
                '<button type="button" class="btn secondary block" id="iv_new_cust_toggle">+ ایجاد مشتری جدید</button></div>' : '') +
              '<div class="form-group"><label for="iv_cust">انتخاب مشتری <span class="req">*</span></label>' +
                '<select id="iv_cust">' + opts(customers, row.customer_id, '— انتخاب مشتری —') + '</select></div>' +
              '<div class="form-group"><label for="iv_doc">پزشک</label>' +
                '<select id="iv_doc">' + opts(doctors, row.doctor_id, '— بدون پزشک —') + '</select></div>' +
              '<div class="form-group"><label for="iv_op">اپراتور</label>' +
                '<select id="iv_op">' + opts(operators, row.operator_id, '— بدون اپراتور —') + '</select></div>' +
            '</div>' +
            (canCreateCustomer ? '<div id="iv_new_cust" class="new-customer-panel" hidden>' +
              '<div class="small muted">مشتری جدید پس از ثبت، به‌صورت خودکار در همین فاکتور انتخاب می‌شود.</div>' +
              '<div class="form-grid">' +
                '<div class="form-group"><label for="iv_nc_name">نام کامل <span class="req">*</span></label><input id="iv_nc_name"></div>' +
                '<div class="form-group"><label for="iv_nc_mobile">موبایل</label><input id="iv_nc_mobile" inputmode="numeric"></div>' +
                '<div class="form-group"><label for="iv_nc_phone">تلفن</label><input id="iv_nc_phone"></div>' +
              '</div>' +
              '<button type="button" class="btn sm gold" id="iv_nc_save">ثبت و اتصال به فاکتور</button>' +
            '</div>' : '') +
          '</section>' +
          '<section class="form-section">' +
            '<div class="form-section-head"><span class="step">۲</span><div><h4>اقلام فاکتور</h4>' +
              '<p class="muted small">خدمت، تعداد، مبلغ واحد و جمع هر ردیف</p></div></div>' +
            '<div id="invItems" class="items-list"></div>' +
            '<button type="button" class="btn secondary sm" id="addItem">+ افزودن خدمت</button>' +
          '</section>' +
          '<section class="form-section">' +
            '<div class="form-section-head"><span class="step">۳</span><div><h4>تخفیف</h4>' +
              '<p class="muted small">' + (isAdmin ? 'ثبت تخفیف برای فاکتور' : 'درخواست تخفیف (پس از تأیید مدیر اعمال می‌شود)') + '</p></div></div>' +
            '<div class="form-grid">' +
              '<div class="form-group"><label for="iv_disc_mode">نوع تخفیف</label>' +
                '<select id="iv_disc_mode"><option value="amount">مبلغ (تومان)</option><option value="percent">درصد (%)</option></select></div>' +
              '<div class="form-group"><label for="iv_disc_value">مقدار تخفیف</label>' +
                '<input id="iv_disc_value" type="number" min="0" inputmode="numeric" placeholder="۰"></div>' +
              '<div class="form-group form-span"><label for="iv_disc_note">شرح تخفیف</label>' +
                '<input id="iv_disc_note" placeholder="دلیل تخفیف (اختیاری)" value="' + esc(row.discount_request_note || '') + '"></div>' +
            '</div>' +
          '</section>' +
          '<section class="inv-summary" aria-live="polite">' +
            '<div class="sum-row"><span>جمع کل خدمات</span><b id="sumSub">—</b></div>' +
            '<div class="sum-row"><span>مجموع تخفیف</span><b id="sumDisc">—</b></div>' +
            '<div class="sum-row" id="sumTaxRow" hidden><span>مالیات <span class="muted small" id="sumTaxRate"></span></span><b id="sumTax">—</b></div>' +
            '<div class="sum-row total"><span id="sumTotalLabel">مبلغ نهایی قابل پرداخت</span><b id="sumTotal">—</b></div>' +
            '<div class="sum-note muted small" id="sumNote"></div>' +
          '</section>' +
        '</div>' +
        '<div class="row" style="margin-top:var(--sp-4)">' +
          '<button type="button" class="btn gold" id="saveInv">ذخیره فاکتور</button>' +
          '<button type="button" class="btn secondary" id="cnInv">انصراف</button>' +
          '<span class="muted small" id="saveHint"></span>' +
        '</div>';
    }
    function buildPayload(){
      return {
        id: row.id || '',
        invoice_date: ($('#iv_date') || {}).value || '',
        customer_id: ($('#iv_cust') || {}).value || '',
        doctor_id: ($('#iv_doc') || {}).value || '',
        operator_id: ($('#iv_op') || {}).value || '',
        discount_requested_toman: discountAmount(localSubtotal()),
        discount_request_note: (($('#iv_disc_note') || {}).value || ''),
        notes: row.notes || '',
        items: items.filter(function(it){
          return it.service_id || Number(it.unit_price_toman) > 0 || String(it.description || '').trim();
        }).map(function(it){
          return { service_id: it.service_id, quantity: Number(it.quantity || 1), unit_price_toman: Number(it.unit_price_toman || 0), description: it.description || '' };
        })
      };
    }

    function validate(p){
      if (!p.invoice_date) return 'تاریخ فاکتور را انتخاب کنید.';
      if (!p.customer_id) return 'انتخاب مشتری الزامی است.';
      if (!p.items.length) return 'حداقل یک خدمت به فاکتور اضافه کنید.';
      for (var i = 0; i < p.items.length; i++) {
        var it = p.items[i];
        if (!it.service_id) return 'ردیف ' + (i + 1) + ': خدمت را انتخاب کنید.';
        if (!(it.quantity > 0)) return 'ردیف ' + (i + 1) + ': تعداد باید بزرگ‌تر از صفر باشد.';
        if (!(it.unit_price_toman >= 0)) return 'ردیف ' + (i + 1) + ': مبلغ واحد نامعتبر است.';
      }
      return '';
    }
    showModal(formHtml(), function(close){
      var listEl = $('#invItems');
      var modalEl = listEl.closest ? listEl.closest('.modal') : null;
      if (modalEl) modalEl.classList.add('modal-wide');
      var modeSel = $('#iv_disc_mode');
      var valInput = $('#iv_disc_value');
      modeSel.value = discMode;
      if (discValue > 0) valInput.value = discValue;

      function paintItems(){ listEl.innerHTML = items.map(itemRow).join(''); }

      function showAlert(kind, msg){
        var box = $('#ivAlert');
        box.innerHTML = msg ? '<div class="alert ' + kind + '">' + esc(msg) + '</div>' : '';
        if (msg) { try { box.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
      }

      function paintTotals(){
        var sub = localSubtotal();
        var disc = discountAmount(sub);
        for (var i = 0; i < items.length; i++) {
          var cell = listEl.querySelector('[data-line="' + i + '"]');
          if (cell) cell.textContent = fmtMoney(lineGross(items[i]));
        }
        $('#sumSub').textContent = fmtMoney(sub);
        $('#sumDisc').textContent = fmtMoney(disc);
        var pending = disc > 0;
        $('#sumTotalLabel').textContent = pending ? 'مبلغ نهایی قابل پرداخت (پیش از تأیید تخفیف)' : 'مبلغ نهایی قابل پرداخت';
        $('#sumTotal').textContent = fmtMoney(sub);
        $('#sumNote').textContent = pending
          ? 'تخفیف ' + fmtMoney(disc) + ' پس از تأیید مدیر از مبلغ فاکتور کسر می‌شود.'
          : '';
      }

      function requestPreview(){
        var payload = buildPayload();
        if (!payload.items.length) { return; }
        var mySeq = ++previewSeq;
        api('invoices.preview', { items: payload.items, discount_requested_toman: 0 }).then(function(p){
          if (mySeq !== previewSeq || !p) return;
          if (p.tax_enabled) {
            $('#sumTaxRow').removeAttribute('hidden');
            $('#sumTaxRate').textContent = '(' + fmtNum(p.tax_rate) + '٪)';
            $('#sumTax').textContent = fmtMoney(p.tax_toman);
          } else {
            $('#sumTaxRow').setAttribute('hidden', 'hidden');
          }
          $('#sumTotal').textContent = fmtMoney(p.total_toman);
        }).catch(function(){ /* keep the local estimate */ });
      }

      function schedulePreview(){
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(requestPreview, 300);
      }

      function readRow(el){
        var i = Number(el.getAttribute('data-i'));
        var k = el.getAttribute('data-k');
        if (isNaN(i) || !k || !items[i]) return null;
        return { i: i, k: k };
      }

      listEl.addEventListener('input', function(e){
        var r = readRow(e.target);
        if (!r) return;
        if (r.k === 'quantity') items[r.i].quantity = Math.max(1, Number(e.target.value || 1));
        else if (r.k === 'unit_price_toman') items[r.i].unit_price_toman = Math.max(0, Number(e.target.value || 0));
        else if (r.k === 'description') items[r.i].description = e.target.value;
        else return;
        paintTotals();
        schedulePreview();
      });

      listEl.addEventListener('change', function(e){
        var r = readRow(e.target);
        if (!r || r.k !== 'service_id') return;
        items[r.i].service_id = e.target.value;
        var svc = svcById(e.target.value);
        var nameEl = listEl.querySelector('[data-name="' + r.i + '"]');
        if (svc) {
          if (nameEl) { nameEl.textContent = svc.name; nameEl.classList.remove('muted'); }
          if (!Number(items[r.i].unit_price_toman)) {
            items[r.i].unit_price_toman = Number(svc.base_price_toman || 0);
            var priceEl = listEl.querySelector('input[data-i="' + r.i + '"][data-k="unit_price_toman"]');
            if (priceEl) priceEl.value = items[r.i].unit_price_toman;
          }
        } else if (nameEl) {
          nameEl.textContent = 'خدمتی انتخاب نشده';
          nameEl.classList.add('muted');
        }
        paintTotals();
        schedulePreview();
      });

      listEl.addEventListener('click', function(e){
        var btn = e.target.closest ? e.target.closest('[data-del]') : null;
        if (!btn) return;
        var i = Number(btn.getAttribute('data-del'));
        if (isNaN(i)) return;
        if (items.length <= 1) items[0] = { service_id:'', quantity:1, unit_price_toman:0, description:'' };
        else items.splice(i, 1);
        paintItems();
        paintTotals();
        schedulePreview();
        showAlert('', '');
      });

      modeSel.onchange = function(){
        discMode = this.value;
        if (discMode === 'percent' && discValue > 100) discValue = 100;
        if (discMode === 'amount' && discValue > 0) discValue = Math.min(discValue, localSubtotal());
        valInput.value = discValue || '';
        paintTotals();
      };
      valInput.oninput = function(){
        discValue = Math.max(0, Number(this.value || 0));
        if (discMode === 'percent') discValue = Math.min(100, discValue);
        paintTotals();
      };
      $('#addItem').onclick = function(){
        items.push({ service_id:'', quantity:1, unit_price_toman:0, description:'' });
        paintItems();
        paintTotals();
        var lastSel = listEl.querySelector('.item-row:last-child select');
        if (lastSel) lastSel.focus();
      };

      if (canCreateCustomer) {
        var ncToggle = $('#iv_new_cust_toggle');
        var ncPanel = $('#iv_new_cust');
        if (ncToggle && ncPanel) ncToggle.onclick = function(){
          var hidden = ncPanel.hasAttribute('hidden');
          if (hidden) ncPanel.removeAttribute('hidden'); else ncPanel.setAttribute('hidden', 'hidden');
          if (hidden) { var nf = $('#iv_nc_name'); if (nf) nf.focus(); }
        };
        var ncSave = $('#iv_nc_save');
        if (ncSave) ncSave.onclick = function(){
          var name = ($('#iv_nc_name').value || '').trim();
          if (!name) { showAlert('error', 'نام کامل مشتری الزامی است.'); return; }
          ncSave.disabled = true; ncSave.textContent = 'در حال ثبت…';
          api('customers.create', { full_name: name, mobile: $('#iv_nc_mobile').value, phone: $('#iv_nc_phone').value }).then(function(created){
            var c = created || {};
            customers.push({ id: c.id, full_name: c.full_name || name });
            var sel = $('#iv_cust');
            var opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.full_name || name;
            sel.appendChild(opt);
            sel.value = c.id;
            ncPanel.setAttribute('hidden', 'hidden');
            $('#iv_nc_name').value = ''; $('#iv_nc_mobile').value = ''; $('#iv_nc_phone').value = '';
            ncSave.disabled = false; ncSave.textContent = 'ثبت و اتصال به فاکتور';
            showAlert('success', 'مشتری «' + (c.full_name || name) + '» ثبت و به این فاکتور متصل شد.');
            toast('مشتری جدید ثبت شد', 'success');
          }).catch(function(e){
            ncSave.disabled = false; ncSave.textContent = 'ثبت و اتصال به فاکتور';
            showAlert('error', e.message || 'خطا در ثبت مشتری');
          });
        };
      }

      $('#cnInv').onclick = function(){ close(); };

      $('#saveInv').onclick = function(){
        var payload = buildPayload();
        var err = validate(payload);
        if (err) { showAlert('error', err); toast(err, 'error'); return; }
        var btn = $('#saveInv');
        btn.disabled = true;
        $('#saveHint').textContent = 'در حال ذخیره…';
        api('invoices.saveDraft', payload).then(function(){
          toast('فاکتور با موفقیت ذخیره شد', 'success');
          close();
          loadRoute('invoices');
        }).catch(function(e){
          btn.disabled = false;
          $('#saveHint').textContent = '';
          showAlert('error', e.message || 'خطا در ذخیره فاکتور');
        });
      };

      paintItems();
      paintTotals();
      if (!row.id) {
        var firstSel = listEl.querySelector('select');
        if (firstSel) firstSel.focus();
      }
    });



  }

/* ------------------------------------------------------ invoice documents --
     One shared printable document for چاپ / PDF / پیش‌نمایش: formal A4 sheet with
     the brand mark, invoice meta, item table, totals and payments. Rows never
     break across pages (page-break-inside: avoid). ---------------------------- */
  var INVOICE_PRINT_CSS = [
    '@page{size:A4;margin:14mm 12mm}',
    '*{box-sizing:border-box}',
    'html,body{margin:0;padding:0;background:#fff;color:#12201E;font-size:12px;',
    "font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif}",

    '.brand-mark{width:64px;height:64px;flex:0 0 64px}',
    '.brand-mark svg{width:64px;height:64px}',
    '.brand-text{flex:1 1 auto}',
    '.brand-name{font-size:20px;font-weight:800;color:#0B3D3A;letter-spacing:.4px}',
    '.brand-sub{font-size:11px;color:#5b6b68;margin-top:2px}',
    '.brand-meta{font-size:11px;line-height:1.9;text-align:left;min-width:190px}',
    '.doc-type{font-weight:800;color:#0B3D3A;font-size:13px}',
    '.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px 0 10px;',
    'padding:8px 10px;border:1px solid #d8dfdc;border-radius:8px;background:#f8faf9}',
    '.meta .k{display:inline-block;min-width:58px;color:#5b6b68}',
    '.meta .v{font-weight:700}',
    'table{width:100%;border-collapse:collapse}',
    '.items{margin-top:8px}',
    '.items th{background:#0B3D3A;color:#fff;font-weight:700;padding:7px 8px;font-size:11px;border:1px solid #0B3D3A}',
    '.items td{border:1px solid #d8dfdc;padding:7px 8px;vertical-align:top}',
    '.items tbody tr{page-break-inside:avoid;break-inside:avoid}',
    '.items tbody tr:nth-child(even) td{background:#f6f8f7}',
    '.n{text-align:center;font-variant-numeric:tabular-nums;direction:ltr}',
    '.c{text-align:right}',
    '.strong{font-weight:800}',
    '.ltr{unicode-bidi:isolate;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}',
    '.totals{margin-top:10px;margin-inline-start:auto;width:78mm;page-break-inside:avoid}',
    '.t-row{display:flex;justify-content:space-between;gap:10px;padding:5px 9px;border-bottom:1px dashed #dfe5e2}',
    '.t-row span{color:#4b5b58}',
    '.t-row b{font-variant-numeric:tabular-nums}',
    '.t-row.grand{border:1px solid #C9A227;background:#fdf8e7;border-radius:6px;margin-top:6px;font-weight:800}',
    '.pays{margin-top:14px;page-break-inside:avoid}',
    '.pays h4{margin:0 0 6px;font-size:12px;color:#0B3D3A}',
    '.pays th{background:#eef2f0;border:1px solid #d8dfdc;padding:6px;font-size:11px}',
    '.pays td{border:1px solid #d8dfdc;padding:6px}',
    '.void-note{margin-top:12px;padding:8px 10px;border:1px solid #b23b2e;background:#fdecea;color:#8c2a20;border-radius:6px;font-weight:700}',
    '.foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:8px;border-top:1px solid #dfe5e2;color:#6b7a77;font-size:10px}'
  ].join('');

  function buildInvoiceDocument(inv, items, pays, names){
    names = names || {};
    var logo = (typeof WRC_LOGO_MARK_HTML === 'string' ? WRC_LOGO_MARK_HTML : '');
    var ver = ((document.querySelector('.js-app-version') || {}).textContent || '0.4.3').trim();
    // Closing tags are assembled from parts on purpose: the preview/desktop
    // harness injects its shim by replacing the closing body tag of the page,
    // so that literal sequence must never appear inside an inline script.
    var DOC_END = '</bo' + 'dy></ht' + 'ml>';
    var itRows = (items || []).map(function(it){
      return '<tr>' +
        '<td class="c">' + esc(it.service_name_snapshot || it.description || '—') + '</td>' +
        '<td class="n">' + fmtNum(it.quantity) + '</td>' +
        '<td class="n">' + fmtMoney(it.unit_price_toman) + '</td>' +
        '<td class="n">' + fmtMoney(it.line_discount_alloc_toman) + '</td>' +
        '<td class="n">' + fmtMoney(it.line_tax_toman) + '</td>' +
        '<td class="n strong">' + fmtMoney(it.line_total_toman) + '</td>' +
      '</tr>';
    }).join('');
    var payRows = (pays || []).map(function(p){
      return '<tr><td class="n">' + esc(p.payment_date || '') + '</td>' +
        '<td class="n">' + fmtMoney(p.amount_toman) + '</td>' +
        '<td class="c">' + esc(paymentMethodLabel(p.method)) + '</td>' +
        '<td class="ltr">' + esc(p.reference_no || '—') + '</td></tr>';
    }).join('');
    return '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">' +
      '<title>فاکتور ' + esc(inv.invoice_no || inv.id) + '</title><style>' + INVOICE_PRINT_CSS + '</style></head><body>' +
      '<div class="sheet">' +
        '<header class="brand">' +
          '<div class="brand-mark">' + logo + '</div>' +
          '<div class="brand-text"><div class="brand-name">White Rose Clinic</div>' +
            '<div class="brand-sub">کلینیک زیبایی رز سفید — فاکتور رسمی خدمات</div></div>' +
          '<div class="brand-meta"><div class="doc-type">فاکتور فروش خدمات</div>' +
            '<div>شماره: <b class="ltr">' + esc(inv.invoice_no || '—') + '</b></div>' +
            '<div>تاریخ: <b>' + esc(faDate(inv.invoice_date)) + '</b></div>' +
            '<div>وضعیت: <b>' + esc(invoiceStatusLabel(inv.status)) + '</b></div></div>' +
        '</header>' +
        '<section class="meta">' +
          '<div><span class="k">مشتری</span><span class="v">' + esc(names.customer || '—') + '</span></div>' +
          '<div><span class="k">موبایل</span><span class="v ltr">' + esc(names.customerMobile || '—') + '</span></div>' +
          '<div><span class="k">پزشک</span><span class="v">' + esc(names.doctor || '—') + '</span></div>' +
          '<div><span class="k">اپراتور</span><span class="v">' + esc(names.operator || '—') + '</span></div>' +
        '</section>' +
        '<table class="items"><thead><tr><th>شرح خدمت</th><th class="n">تعداد</th><th class="n">مبلغ واحد</th>' +
          '<th class="n">سهم تخفیف</th><th class="n">مالیات</th><th class="n">مبلغ کل</th></tr></thead>' +
          '<tbody>' + itRows + '</tbody></table>' +
        '<section class="totals">' +
          '<div class="t-row"><span>جمع خدمات</span><b>' + fmtMoney(inv.subtotal_toman) + '</b></div>' +
          '<div class="t-row"><span>تخفیف</span><b>' + fmtMoney(inv.discount_toman) + '</b></div>' +
          '<div class="t-row"><span>مالیات</span><b>' + fmtMoney(inv.tax_toman) + '</b></div>' +
          '<div class="t-row grand"><span>مبلغ نهایی قابل پرداخت</span><b>' + fmtMoney(inv.total_toman) + '</b></div>' +
          '<div class="t-row"><span>پرداخت‌شده</span><b>' + fmtMoney(inv.paid_toman) + '</b></div>' +

  function printInvoiceDocument(html){

    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:fixed;inset:0;width:0;height:0;border:0;opacity:0;pointer-events:none';
    document.body.appendChild(frame);
    var doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    setTimeout(function(){
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch (e) { toast('چاپ ممکن نشد', 'error'); }
      setTimeout(function(){ try { document.body.removeChild(frame); } catch (e) {} }, 60000);
    }, 350);
  }

  /* ---------------------------------------------------------- design system --
     One modal implementation for every prompt/confirm in the app, so no native
     window.alert/prompt dialog with the OS look is ever shown. ---------------- */
  function promptModal(opts){
    opts = opts || {};
    var fields = opts.fields || [];
    var idOf = function(k){ return 'pm_' + k; };
    var html = '<h3>' + esc(opts.title || '') + '</h3>' +
      (opts.message ? '<div class="alert ' + (opts.tone || 'info') + '">' + esc(opts.message) + '</div>' : '') +
      '<div id="pmAlert" role="alert"></div>' +
      '<div class="form-grid">' + fields.map(function(f){
        var input;
        if (f.type === 'select') {
          input = '<select id="' + idOf(f.key) + '" data-pm-key="' + esc(f.key) + '">' +
            (f.options || []).map(function(o){
              var val = String(o[0]), label = o[1];
              return '<option value="' + esc(val) + '"' + (String(f.value) === val ? ' selected' : '') + '>' + esc(label) + '</option>';
            }).join('') + '</select>';
        } else if (f.type === 'textarea') {
          input = '<textarea id="' + idOf(f.key) + '" data-pm-key="' + esc(f.key) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(f.value || '') + '</textarea>';
        } else {
          input = '<input id="' + idOf(f.key) + '" data-pm-key="' + esc(f.key) + '" type="' + (f.type || 'text') + '"' +
            (f.type === 'number' ? ' inputmode="numeric" min="' + (f.min === undefined ? 0 : f.min) + '" step="' + (f.step || 1) + '"' : '') +
            ' dir="' + (f.dir || (f.type === 'number' || f.type === 'date' ? 'ltr' : 'auto')) + '"' +
            ' value="' + esc(f.value === undefined || f.value === null ? '' : f.value) + '"' +
            ' placeholder="' + esc(f.placeholder || '') + '">';
        }
        return '<div class="form-group' + (f.full ? ' form-span' : '') + '"><label for="' + idOf(f.key) + '">' + esc(f.label) +
          (f.required ? ' <span class="req">*</span>' : '') + '</label>' + input +
          (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="row" style="margin-top:var(--sp-3)">' +
        '<button type="button" class="btn ' + (opts.tone === 'danger' ? 'danger' : 'gold') + '" id="pmOk">' + esc(opts.submitLabel || 'تأیید') + '</button>' +
        '<button type="button" class="btn secondary" id="pmCancel">انصراف</button>' +
      '</div>';

    showModal(html, function(close){
      var okBtn = $('#pmOk'), cancelBtn = $('#pmCancel');
      if (cancelBtn) cancelBtn.onclick = close;
      var first = document.querySelector('[data-pm-key]');
      if (first) try { first.focus(); } catch (e) {}
      if (okBtn) okBtn.onclick = function(){
        var values = {};
        $all('[data-pm-key]').forEach(function(el){ values[el.getAttribute('data-pm-key')] = el.value; });
        var msg = '';
        fields.forEach(function(f){
          if (f.required && !String(values[f.key] || '').trim()) msg = msg || (f.label + ' الزامی است.');
        });
        if (!msg && typeof opts.validate === 'function') msg = opts.validate(values) || '';
        if (msg) { $('#pmAlert').innerHTML = '<div class="alert error">' + esc(msg) + '</div>'; return; }
        okBtn.disabled = true;
        try { opts.onSubmit(values, close); }
        catch (e) { okBtn.disabled = false; $('#pmAlert').innerHTML = '<div class="alert error">' + esc(e.message || 'خطا') + '</div>'; }
      };
    });
  }

    });
  }

  /* Only digits (Persian/Arabic digits are converted), a single leading +, and
     the leading zero of Iranian numbers is preserved. */
  function sanitizePhoneValue(v){
    var fa = '۰۱۲۳۴۵۶۷۸۹', ar = '٠١٢٣٤٥٦٧٨٩', s = String(v == null ? '' : v), out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i), fi = fa.indexOf(ch), ai = ar.indexOf(ch);
      out += fi >= 0 ? String(fi) : (ai >= 0 ? String(ai) : ch);
    }
    var plus = out.trim().charAt(0) === '+';
    out = out.replace(/[^0-9]/g, '');
    if (plus) out = '+' + out;
    return out.slice(0, plus ? 15 : 11);
  }
  function bindPhoneInputs(root){
    $all('[data-phone]', root || document).forEach(function(el){
      el.addEventListener('input', function(){ var v = sanitizePhoneValue(el.value); if (el.value !== v) el.value = v; });
      el.setAttribute('inputmode', 'numeric');
    });
  }
  function phoneField(id, label, value, kind){
    return '<div class="form-group"><label for="' + id + '">' + esc(label) + '</label>' +
      '<input id="' + id + '" class="ltr-num" dir="ltr" data-phone data-phone-kind="' + (kind || 'mobile') + '"' +
      ' value="' + esc(value || '') + '" placeholder="09121234567" maxlength="15" autocomplete="off"></div>';
  }
  function showModal(content, onBind){

    var root = document.createElement('div');
    root.className = 'modal-backdrop';
    root.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+content+'</div>';
    document.body.appendChild(root);
    document.body.classList.add('modal-open');

    function onKey(e){ if(e.key === 'Escape'){ close(); } }
    function close(){
      try{ document.body.removeChild(root); }catch(e){}
      document.body.classList.remove('modal-open');
      document.removeEventListener('keydown', onKey);
    }

    document.addEventListener('keydown', onKey);
    root.addEventListener('click', function(e){ if(e.target===root) close(); });
    try{
      var first = root.querySelector('input,select,textarea');
      if(first) first.focus();
    }catch(e){}
    onBind(close, root);
  }

    }).join('');
    showModal('<h3>کاربر جدید</h3>' +
      '<div class="alert info">رمز اولیه را به کاربر اطلاع دهید؛ در اولین ورود، تغییر رمز الزامی است.</div>' +
      '<div class="form-grid">' +
        '<div class="form-group"><label>نام کاربری</label><input id="nuUser" dir="ltr" autocomplete="off"></div>' +
        '<div class="form-group"><label>رمز عبور</label><input id="nuPass" type="password" autocomplete="new-password"></div>' +
        '<div class="form-group"><label>نام نمایشی</label><input id="nuName"></div>' +
        '<div class="form-group"><label>نقش نمایشی منو</label><select id="nuLegacy">' +
          '<option value="admin">مدیر</option><option value="operator" selected>اپراتور</option><option value="doctor">پزشک</option>' +
        '</select></div>' +
        '<div class="form-group"><label>پزشک مرتبط (برای نقش پزشک)</label><select id="nuDoctor">' + doctorOptions + '</select></div>' +
        '<div class="form-group"><label>اپراتور مرتبط</label><select id="nuOperator">' + operatorOptions + '</select></div>' +
      '</div>' +
      '<div class="form-group"><label>نقش‌ها</label>' + roleChecks(roles, []) + '</div>' +
      '<div class="row"><button class="btn gold" id="nuSave">ذخیره</button><button class="btn secondary" id="nuCancel">انصراف</button></div>',
      function(close){
        $('#nuCancel').onclick = close;
        $('#nuSave').onclick = function(){
          var codes = selectedRoleCodes();
          if (!codes.length) { toast('حداقل یک نقش انتخاب کنید', 'error'); return; }
          $('#nuSave').disabled = true;
          api('users.create', {
            username: ($('#nuUser').value || '').trim().toLowerCase(),
            password: $('#nuPass').value,
            display_name: ($('#nuName').value || '').trim(),
            role_codes: codes,
            linked_doctor_id: $('#nuDoctor').value || null,
            linked_operator_id: $('#nuOperator').value || null,
            must_change_password: true
          }).then(function(){ toast('کاربر ایجاد شد', 'success'); close(); loadRoute('users'); })
            .catch(function(e){ toast(e.message || 'خطا', 'error'); $('#nuSave').disabled = false; });
        };
      });
  }

  function handleUserAction(action, userId, rows, roles){
    var user = (rows || []).filter(function(u){ return u.id === userId; })[0];
    if (!user) return;
    if (action === 'roles') {
      showModal('<h3>نقش‌های ' + esc(user.username) + '</h3>' +
        '<div class="muted small">مجوز مؤثر کاربر از اجتماع مجوزهای این نقش‌ها محاسبه می‌شود.</div>' +
        '<div class="form-group" style="margin-top:10px">' + roleChecks(roles, user.roles || []) + '</div>' +
        '<div class="row"><button class="btn gold" id="rSave">ذخیره</button><button class="btn secondary" id="rCancel">انصراف</button></div>',
        function(close){
          $('#rCancel').onclick = close;
          $('#rSave').onclick = function(){
            var current = user.roles || [];
            var wanted = selectedRoleCodes();
            if (!wanted.length) { toast('حداقل یک نقش لازم است', 'error'); return; }
            var toAdd = wanted.filter(function(c){ return current.indexOf(c) < 0; });
            var toRemove = current.filter(function(c){ return wanted.indexOf(c) < 0; });
            var chain = Promise.resolve();
            if (toAdd.length) chain = chain.then(function(){ return api('roles.assign', { user_id: user.id, role_codes: toAdd }); });
            if (toRemove.length) chain = chain.then(function(){ return api('roles.revoke', { user_id: user.id, role_codes: toRemove }); });
            $('#rSave').disabled = true;
            chain.then(function(){ toast('نقش‌ها به‌روزرسانی شد', 'success'); close(); loadRoute('users'); })
              .catch(function(e){ toast(e.message || 'خطا', 'error'); $('#rSave').disabled = false; });
          };
        });
      return;
    }
    if (action === 'toggle') {
      var disabling = !!user.is_active;
      confirmModal({ title: disabling ? 'غیرفعال‌سازی کاربر' : 'فعال‌سازی کاربر',
        tone: disabling ? 'danger' : 'info',
        message: disabling ? 'با غیرفعال‌سازی، تمام نشست‌های کاربر بسته می‌شود.' : 'کاربر می‌تواند دوباره وارد شود.',
        confirmLabel: disabling ? 'غیرفعال کن' : 'فعال کن',
        onConfirm: function(){
          api(disabling ? 'users.disable' : 'users.enable', { user_id: user.id })
            .then(function(){ toast('وضعیت به‌روزرسانی شد', 'success'); loadRoute('users'); })
            .catch(function(e){ toast(e.message || 'خطا', 'error'); });
        }});
      return;
    }
    if (action === 'unlock') {
      confirmModal({ title: 'بازکردن قفل حساب', message: 'شمارندهٔ تلاش‌های ناموفق و قفل حساب پاک می‌شود.', confirmLabel: 'باز کن',
        onConfirm: function(){
          api('users.unlock', { user_id: user.id })
            .then(function(){ toast('حساب باز شد', 'success'); loadRoute('users'); })
            .catch(function(e){ toast(e.message || 'خطا', 'error'); });
        }});
      return;
    }
    if (action === 'reset') {
      showModal('<h3>بازنشانی رمز ' + esc(user.username) + '</h3>' +
        '<div class="alert warn">کاربر در ورود بعدی باید رمز را تغییر دهد و همهٔ نشست‌های فعلی بسته می‌شوند.</div>' +
        '<div class="form-group"><label>رمز جدید</label><input id="rpPass" type="password" autocomplete="new-password"></div>' +
        '<div class="row"><button class="btn gold" id="rpSave">ذخیره</button><button class="btn secondary" id="rpCancel">انصراف</button></div>',
        function(close){
          $('#rpCancel').onclick = close;
          $('#rpSave').onclick = function(){
            api('users.change_password', { user_id: user.id, new_password: $('#rpPass').value })
              .then(function(){ toast('رمز بازنشانی شد', 'success'); close(); loadRoute('users'); })
              .catch(function(e){ toast(e.message || 'خطا', 'error'); });
          };
        });
      return;
    }
    if (action === 'sessions') {
      api('users.sessions', { user_id: user.id }).then(function(data){
        var items = (data && data.sessions) || [];
        var rowsHtml = items.map(function(s){
          return '<tr><td class="ltr-num">' + esc(s.issued_at || '') + '</td><td class="ltr-num">' + esc(s.ip_address || '-') + '</td>' +
            '<td class="ltr-num">' + esc(s.idle_expires_at || '') + '</td>' +
            '<td><button class="btn secondary sm" data-srev="' + esc(s.id) + '">ابطال</button></td></tr>';
        }).join('');
        showModal('<h3>نشست‌های فعال ' + esc(user.username) + '</h3>' +
          '<div class="table-wrap"><table><thead><tr><th>ورود</th><th>IP</th><th>انقضای بی‌کاری</th><th></th></tr></thead><tbody>' +
          (rowsHtml || '<tr><td colspan="4" class="muted">نشست فعالی وجود ندارد.</td></tr>') + '</tbody></table></div>' +
          '<div class="row" style="margin-top:10px"><button class="btn danger" id="sRevokeAll">ابطال همه</button>' +
          '<button class="btn secondary" id="sClose">بستن</button></div>',
          function(close){
            $('#sClose').onclick = close;
            $('#sRevokeAll').onclick = function(){
              api('users.revoke_sessions', { user_id: user.id, reason: 'admin_revoke_all' })
                .then(function(){ toast('همهٔ نشست‌ها بسته شد', 'success'); close(); loadRoute('users'); })
                .catch(function(e){ toast(e.message || 'خطا', 'error'); });
            };
            $all('[data-srev]').forEach(function(btn){
              btn.onclick = function(){
                api('users.revoke_sessions', { user_id: user.id, session_id: btn.getAttribute('data-srev'), reason: 'admin_revoke' })
                  .then(function(){ toast('نشست بسته شد', 'success'); close(); loadRoute('users'); })
                  .catch(function(e){ toast(e.message || 'خطا', 'error'); });
              };
            });
          });
      }).catch(function(e){ toast(e.message || 'خطا', 'error'); });
      return;
    }
    if (action === 'activity') {
      api('users.activity', { user_id: user.id, limit: 50 }).then(function(data){
        var items = (data && data.rows) || [];
        var rowsHtml = items.map(function(ev){
          return '<tr><td class="ltr-num">' + esc(ev.occurred_at || '') + '</td><td>' + esc(ev.action) + '</td>' +
            '<td>' + (ev.result === 'ok' ? '<span class="badge ok">موفق</span>' : '<span class="badge error">ناموفق</span>') + '</td>' +
            '<td class="ltr-num">' + esc(ev.ip_address || '-') + '</td></tr>';
        }).join('');
        showModal('<h3>فعالیت‌های ' + esc(user.username) + '</h3>' +
          '<div class="table-wrap"><table><thead><tr><th>زمان</th><th>رویداد</th><th>نتیجه</th><th>IP</th></tr></thead><tbody>' +
          (rowsHtml || '<tr><td colspan="4" class="muted">رویدادی ثبت نشده است.</td></tr>') + '</tbody></table></div>' +
          '<div class="row" style="margin-top:10px"><button class="btn secondary" id="aClose">بستن</button></div>',
          function(close){ $('#aClose').onclick = close; });
      }).catch(function(e){ toast(e.message || 'خطا', 'error'); });
    }
  }

  function permChecks(catalog, selected){
    var modules = (catalog && catalog.modules) || [];
    return modules.map(function(m){
      return '<div style="margin-bottom:10px"><div class="muted small" style="font-weight:700">' + esc(m.module) + '</div>' +
        m.permissions.map(function(p){
          var on = (selected || []).indexOf(p.code) >= 0;
          var allowed = hasPerm(p.code);
          return '<label style="display:flex;gap:8px;align-items:center;padding:2px 0;' + (allowed ? '' : 'opacity:.55') + '">' +
            '<input type="checkbox" data-perm="' + esc(p.code) + '"' + (on ? ' checked' : '') + (allowed ? '' : ' disabled') + '>' +
            '<span>' + esc(p.description) + ' <span class="muted small">(' + esc(p.code) + ')</span></span></label>';
        }).join('') + '</div>';
    }).join('');
  }

  function selectedPermCodes(){
    return $all('[data-perm]:checked').map(function(input){ return input.getAttribute('data-perm'); });
  }

  function viewRoles(){
    return Promise.all([api('roles.list', {}), api('permissions.list', {})]).then(function(res){
      var roles = (res[0] && res[0].roles) || [];
      var catalog = res[1] || {};
      var canManage = hasPerm('rbac.manage');
      var body = roles.map(function(role){
        return '<tr><td><code>' + esc(role.code) + '</code></td><td>' + esc(role.name) + '</td>' +
          '<td>' + fmtNum((role.permissions || []).length) + '</td><td>' + fmtNum(role.users_count || 0) + '</td>' +
          '<td>' + (role.is_active ? '<span class="badge ok">فعال</span>' : '<span class="badge">غیرفعال</span>') +
          (role.is_system ? ' <span class="badge gold">سیستمی</span>' : '') + '</td>' +
          '<td>' + (canManage && !role.is_system
            ? '<div class="row" style="gap:6px"><button class="btn secondary sm" data-ract="edit" data-rcode="' + esc(role.code) + '">ویرایش</button>' +
              '<button class="btn secondary sm" data-ract="perms" data-rcode="' + esc(role.code) + '">مجوزها</button></div>'
            : '<span class="muted small">—</span>') + '</td></tr>';
      }).join('');
      $('#content').innerHTML = '<div class="panel"><div class="panel-header"><h2>نقش‌ها و مجوزها</h2><div class="toolbar">' +
        (canManage ? '<button class="btn gold sm" id="addRole">نقش جدید</button>' : '') +
        '<span class="muted small">' + fmtNum(roles.length) + ' نقش</span></div></div>' +
        '<div class="alert info">مجوز مؤثر هر کاربر، اجتماع مجوزهای نقش‌های فعال اوست. اعطای مجوزی که خودتان ندارید مجاز نیست.</div>' +
        '<div class="table-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>مجوزها</th><th>کاربران</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
        (body || '<tr><td colspan="6" class="muted">نقشی تعریف نشده است.</td></tr>') + '</tbody></table></div></div>';
      if (!canManage) return;
      $('#addRole').onclick = function(){ openRoleCreate(catalog); };
      $all('[data-ract]').forEach(function(btn){
        btn.onclick = function(){
          var code = btn.getAttribute('data-rcode');
          var role = roles.filter(function(r){ return r.code === code; })[0];
          if (!role) return;
          if (btn.getAttribute('data-ract') === 'edit') openRoleEdit(role);
          else openRolePermissions(role, catalog);
        };
      });
    });
  }


  function openRoleCreate(catalog){
    showModal('<h3>نقش جدید</h3>' +
      '<div class="form-grid">' +
        '<div class="form-group"><label>کد نقش (انگلیسی، تغییرناپذیر)</label><input id="nrCode" dir="ltr" placeholder="reception"></div>' +
        '<div class="form-group"><label>نام نمایشی</label><input id="nrName" placeholder="پذیرش"></div>' +
        '<div class="form-group"><label>نقش نمایشی منو</label><select id="nrLegacy">' +
          '<option value="operator" selected>اپراتور</option><option value="admin">مدیر</option><option value="doctor">پزشک</option>' +
        '</select></div>' +
      '</div>' +
      '<div class="form-group"><label>توضیح</label><input id="nrDesc"></div>' +
      '<div class="form-group"><label>مجوزها (فقط مجوزهای قابل اعطا فعال است)</label>' +
        '<div style="max-height:260px;overflow:auto;border:1px solid var(--line,#ddd);border-radius:8px;padding:8px">' +
        permChecks(catalog, []) + '</div></div>' +
      '<div class="row"><button class="btn gold" id="nrSave">ذخیره</button><button class="btn secondary" id="nrCancel">انصراف</button></div>',
      function(close){
        $('#nrCancel').onclick = close;
        $('#nrSave').onclick = function(){
          api('roles.create', {
            code: ($('#nrCode').value || '').trim().toLowerCase(),
            name: ($('#nrName').value || '').trim(),
            description: ($('#nrDesc').value || '').trim(),
            legacy_role: $('#nrLegacy').value,
            permissions: selectedPermCodes()
          }).then(function(){ toast('نقش ایجاد شد', 'success'); close(); loadRoute('roles'); })
            .catch(function(e){ toast(e.message || 'خطا', 'error'); });
        };
      });
  }

  function openRoleEdit(role){
    showModal('<h3>ویرایش نقش ' + esc(role.code) + '</h3>' +
      '<div class="form-grid">' +
        '<div class="form-group"><label>نام نمایشی</label><input id="erName" value="' + esc(role.name) + '"></div>' +
        '<div class="form-group"><label>نقش نمایشی منو</label><select id="erLegacy">' +
          ['admin', 'operator', 'doctor'].map(function(code){
            return '<option value="' + code + '"' + (role.legacy_role === code ? ' selected' : '') + '>' + esc(roleLabel(code)) + '</option>';
          }).join('') + '</select></div>' +
      '</div>' +
      '<div class="form-group"><label>توضیح</label><input id="erDesc" value="' + esc(role.description || '') + '"></div>' +
      '<div class="form-group"><label class="switch"><input type="checkbox" id="erActive"' + (role.is_active ? ' checked' : '') + '><span class="switch-label">فعال</span></label></div>' +
      '<div class="row"><button class="btn gold" id="erSave">ذخیره</button><button class="btn secondary" id="erCancel">انصراف</button></div>',
      function(close){
        $('#erCancel').onclick = close;
        $('#erSave').onclick = function(){
          api('roles.update', {
            code: role.code,
            name: $('#erName').value,
            description: $('#erDesc').value,
            is_active: $('#erActive').checked,
            legacy_role: $('#erLegacy').value
          }).then(function(){ toast('نقش به‌روزرسانی شد', 'success'); close(); loadRoute('roles'); })
            .catch(function(e){ toast(e.message || 'خطا', 'error'); });
        };
      });
  }

  function openRolePermissions(role, catalog){
    showModal('<h3>مجوزهای نقش ' + esc(role.name) + '</h3>' +
      '<div class="alert info">مجوزهای خاکستری، مجوزهایی هستند که شما خودتان ندارید و نمی‌توانید اعطا کنید.</div>' +
      '<div style="max-height:320px;overflow:auto;border:1px solid var(--line,#ddd);border-radius:8px;padding:8px">' +
      permChecks(catalog, role.permissions || []) + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn gold" id="prSave">ذخیره</button>' +
      '<button class="btn secondary" id="prCancel">انصراف</button></div>',
      function(close){
        $('#prCancel').onclick = close;
        $('#prSave').onclick = function(){
          var current = role.permissions || [];
          var wanted = selectedPermCodes();
          var toAdd = wanted.filter(function(c){ return current.indexOf(c) < 0; });
          var toRemove = current.filter(function(c){ return wanted.indexOf(c) < 0; });
          var chain = Promise.resolve();
          if (toAdd.length) chain = chain.then(function(){ return api('permissions.assign', { role_code: role.code, permission_codes: toAdd }); });
          if (toRemove.length) chain = chain.then(function(){ return api('permissions.revoke', { role_code: role.code, permission_codes: toRemove }); });
          chain.then(function(){ toast('مجوزها به‌روزرسانی شد', 'success'); close(); loadRoute('roles'); })
            .catch(function(e){ toast(e.message || 'خطا', 'error'); });
        };
      });
  }

  function viewAudit(){
    var filters = state.auditFilter || { action: '', result: '', from: '', to: '' };
    api('audit.list', {
      action: filters.action || null,
      result: filters.result || null,
      from: filters.from || null,
      to: filters.to || null,
      limit: 100
    }).then(function(data){
      var rows = (data && data.rows) || [];
      var body = rows.map(function(ev, idx){
        return '<tr data-aidx="' + idx + '" style="cursor:pointer"><td class="ltr-num">' + esc(String(ev.occurred_at || '').replace('T', ' ').substring(0, 19)) + '</td>' +
          '<td>' + esc(ev.actor_username || '-') + '</td><td><code>' + esc(ev.action) + '</code></td>' +
          '<td>' + esc(ev.entity || '') + '</td>' +
          '<td>' + (ev.result === 'ok' ? '<span class="badge ok">موفق</span>' : '<span class="badge error">ناموفق</span>') + '</td>' +
          '<td class="ltr-num">' + esc(ev.ip_address || '-') + '</td></tr>';
      }).join('');
      $('#content').innerHTML = '<div class="panel"><div class="panel-header"><h2>گزارش رویدادها</h2>' +
        '<div class="toolbar"><span class="muted small">' + fmtNum((data && data.total) || 0) + ' رویداد</span></div></div>' +
        '<div class="alert info">این گزارش فقط-افزودنی است؛ از طریق برنامه قابل ویرایش یا حذف نیست و اطلاعات حساس در آن ثبت نمی‌شود.</div>' +
        '<div class="form-grid">' +
          '<div class="form-group"><label>رویداد</label><input id="afAction" dir="ltr" value="' + esc(filters.action) + '" placeholder="auth.login_failed"></div>' +
          '<div class="form-group"><label>نتیجه</label><select id="afResult">' +
            '<option value=""' + (filters.result === '' ? ' selected' : '') + '>همه</option>' +
            '<option value="ok"' + (filters.result === 'ok' ? ' selected' : '') + '>موفق</option>' +
            '<option value="fail"' + (filters.result === 'fail' ? ' selected' : '') + '>ناموفق</option>' +
          '</select></div>' +
          '<div class="form-group"><label>از تاریخ (ISO)</label><input id="afFrom" dir="ltr" value="' + esc(filters.from) + '" placeholder="2026-11-01"></div>' +
          '<div class="form-group"><label>تا تاریخ (ISO)</label><input id="afTo" dir="ltr" value="' + esc(filters.to) + '" placeholder="2026-11-30"></div>' +
        '</div>' +
        '<div class="row"><button class="btn gold sm" id="afApply">اعمال فیلتر</button>' +
        '<button class="btn secondary sm" id="afReset">پاک‌کردن</button></div>' +
        '<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>زمان</th><th>کاربر</th><th>رویداد</th><th>موجودیت</th><th>نتیجه</th><th>IP</th></tr></thead><tbody>' +
        (body || '<tr><td colspan="6" class="muted">رویدادی یافت نشد.</td></tr>') + '</tbody></table></div></div>';
      $('#afApply').onclick = function(){
        state.auditFilter = {
          action: ($('#afAction').value || '').trim(),
          result: $('#afResult').value,
          from: ($('#afFrom').value || '').trim(),
          to: ($('#afTo').value || '').trim()
        };
        loadRoute('audit');
      };
      $('#afReset').onclick = function(){ state.auditFilter = null; loadRoute('audit'); };
      $all('[data-aidx]').forEach(function(tr){
        tr.onclick = function(){
          var ev = rows[Number(tr.getAttribute('data-aidx'))];
          if (!ev) return;
          var detailsText = JSON.stringify(ev.details || {}, null, 2);
          showModal('<h3>رویداد ' + esc(ev.action) + '</h3>' +
            '<div class="muted small">شناسه: <span class="ltr-num">' + esc(ev.id) + '</span></div>' +
            '<div class="form-grid" style="margin-top:8px">' +
              '<div class="form-group"><label>زمان</label><input readonly value="' + esc(ev.occurred_at || '') + '"></div>' +
              '<div class="form-group"><label>کاربر عامل</label><input readonly value="' + esc(ev.actor_username || '-') + '"></div>' +
              '<div class="form-group"><label>موجودیت</label><input readonly value="' + esc((ev.entity || '') + ' / ' + (ev.entity_id || '')) + '"></div>' +
              '<div class="form-group"><label>Correlation</label><input readonly value="' + esc(ev.request_id || '-') + '"></div>' +
            '</div>' +
            '<div class="form-group"><label>جزئیات (غیرحساس)</label><pre dir="ltr" style="white-space:pre-wrap;max-height:220px;overflow:auto;font-size:12px">' + esc(detailsText) + '</pre></div>' +
            '<div class="row"><button class="btn secondary" id="adClose">بستن</button></div>',
            function(close){ $('#adClose').onclick = close; });
        };
      });
    });
  }

  function boot(){
    api('system.ping', {}).then(function(r){
      if (r && r.app) applyVersion(r.app.version || r.app.VERSION);
    }).catch(function(){}).then(function(){
      if(state.token){
        api('auth.me',{}).then(function(d){ state.user = d.user; render(); }).catch(function(){ setToken(''); state.user=null; render(); });
      } else {
        render();
      }
    });
  }

  boot();
})();
</script>
